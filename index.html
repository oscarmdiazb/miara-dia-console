<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console MIARA-DIA</title>
<style>
:root{
  --bg:#FBF6F2; --card:#FFFFFF; --ink:#2B2220; --muted:#7A6A64; --line:#EADBD2;
  --brand:#B45E48; --brand-d:#7D3C30; --brand-l:#FBE6DA;
  --ok:#2F7D4F; --ok-l:#E2F2E8; --warn:#9A6B00; --warn-l:#FFF3CC; --bad:#B3261E; --bad-l:#FCE4E2;
  --info:#2F5D8A; --info-l:#E3EEF8; --grey-l:#F1ECE9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1816; --card:#2A2321; --ink:#F3ECE8; --muted:#B9AAA3; --line:#463A36;
    --brand:#E0937B; --brand-d:#F2B8A5; --brand-l:#4A2E26;
    --ok:#7FD3A0; --ok-l:#1F3A2A; --warn:#F2C95C; --warn-l:#3D3216; --bad:#F2A19B; --bad-l:#4A2422;
    --info:#9CC3EA; --info-l:#1F3042; --grey-l:#352D2A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto}
.logo{font-weight:800;color:var(--brand-d);letter-spacing:.3px}
.logo small{font-weight:500;color:var(--muted)}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:1100px;margin:0 auto}
nav button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
nav button.on{color:var(--brand-d);border-bottom-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.small{padding:4px 9px;font-size:13px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-size:13px;text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar select,.bar input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;max-width:100%}
.bar input[type=search]{flex:1;min-width:160px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{color:var(--muted);font-size:12px}
.prog{height:10px;background:var(--grey-l);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.dirty{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l)}
.ch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px;font-size:13px}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);word-break:break-all}
.sec{color:var(--muted);font-size:12px}
.meta{margin-left:auto;color:var(--muted);font-size:12px}
.chip{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.s-vide,.s-a_enregistrer{background:var(--grey-l);color:var(--muted)}
.s-a_revoir,.s-a_corriger{background:var(--warn-l);color:var(--warn)}
.s-brouillon,.s-enregistre{background:var(--info-l);color:var(--info)}
.s-valide,.s-verifie{background:var(--ok-l);color:var(--ok)}
.flag{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:13px;margin-bottom:8px}
.pend{background:var(--brand-l);color:var(--brand-d)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.cols{grid-template-columns:1fr}
  .stat{min-width:0;flex:1 1 28%;padding:6px 8px}.stat b{font-size:17px}.stat span{font-size:11px}
  main{padding:12px}.card{padding:10px 11px}}
.lang{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.fr{white-space:pre-wrap;background:var(--grey-l);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;resize:vertical;min-height:42px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
textarea.mg{font-size:16px}
.read{font-size:18px;line-height:1.55}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.sbtns{display:flex;flex-wrap:wrap;gap:4px}
.sbtns button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.sbtns button.on{border-color:transparent}
.note{font-size:13.5px}
.warn{color:var(--bad);font-size:12.5px}
.hist{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.hist div{margin:3px 0}
.saveas{font-family:ui-monospace,Menlo,monospace;background:var(--brand-l);color:var(--brand-d);padding:2px 8px;border-radius:6px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h1{margin:0 0 4px;color:var(--brand-d);font-size:22px}
.login p{color:var(--muted);margin:0 0 16px}
.login label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card)}
.err{color:var(--bad);margin-top:10px;font-size:14px}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:18px 0 8px}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.help summary{cursor:pointer;font-weight:600;color:var(--brand-d)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{color:var(--muted);padding:20px;text-align:center}
.vt-A{--tc:var(--info);--tl:var(--info-l)} .vt-B{--tc:var(--brand);--tl:var(--brand-l)}
.vday{margin:18px 0 6px;font-size:18px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.vteam{border-left:5px solid var(--tc);border-radius:0 12px 12px 0}
.vteam h3{margin:0 0 4px;font-size:16px;color:var(--tc)}
.vstop{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.vnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.vlong{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:13px;margin:6px 0}
.rsel{width:100%;font-size:16px;padding:10px;margin:4px 0 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}
.rcount{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.rcount label{display:flex;flex-direction:column;font-size:13px;font-weight:700;width:62px}
.rcount input,.sheetbody input[type=number],.sheetbody input[type=text],.sheetbody input:not([type]){width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:16px;margin:2px 0 8px}
.rgrade{margin:18px 0 6px;font-size:17px}
.rcontact{display:grid;grid-template-columns:1fr;gap:4px;margin-top:6px}
.rcontact label{display:flex;flex-direction:column;font-size:13px;font-weight:700}
.rcontact input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:16px;margin-top:2px}
@media(min-width:640px){.rcontact{grid-template-columns:1fr 1fr 1fr}}
.rthumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.rthumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.rft{position:relative;font-size:12px;max-width:90px;word-break:break-all}
.rft .rx{position:absolute;top:-8px;right:-8px;border-radius:50%;width:24px;height:24px;padding:0;line-height:22px;background:var(--card);border:1px solid var(--line)}
.rview img{max-width:100%;border-radius:8px;margin-top:6px;display:block}
.rrow{display:flex;gap:10px}.rrow>div{flex:1}
.rtab td.n{text-align:center;white-space:nowrap}.rtab tr{cursor:pointer}
#vmap{height:360px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;background:var(--grey-l)}
.vpin{width:24px;height:24px;border-radius:50%;color:#fff;font:700 12px/24px system-ui,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sum{display:flex;gap:16px;font-size:15px;margin-bottom:4px}.sum b{font-size:20px}
.prog{position:relative}.prog i{position:absolute;left:0;top:0}.prog i.rec{background:var(--info-l)}
.help{font-size:13.5px;color:var(--muted);background:none;border:0;padding:0 2px;margin-bottom:10px}
.card.isok{opacity:.75}
.okbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.okbtn{font-weight:700}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.grp>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--muted);margin-right:-4px}
.grp[open]>summary::before{content:"▾"}
.grp[open]>summary{border-bottom:1px solid var(--line)}
.gname{font-weight:700;flex:1 1 200px}
.gprog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar{display:inline-block;width:46px;height:7px;background:var(--grey-l);border-radius:4px;overflow:hidden;margin-right:6px}
.mbar i{display:block;height:100%;background:var(--ok)}
.mbar.a i{background:var(--info)}
.gcards{padding:10px}
.gcards .card{margin-bottom:8px}
/* ---- problèmes ---- */
.nbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
.nbadge[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;overflow:hidden}
@media (min-width:600px){.sheet{align-items:center}.sheetbox{border-radius:16px}}
.sheetbody{padding:12px 14px 18px;overflow-y:auto}
.sheetbody textarea,.sheetbody input[type=search]{width:100%;box-sizing:border-box;margin-top:8px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.tchip[aria-pressed="true"]{background:var(--warn-l);border-color:var(--warn);color:var(--warn);font-weight:700}
.itgt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px}
.ires{max-height:38dvh;overflow-y:auto;margin:6px 0}
.ihit{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font:inherit;color:var(--ink);cursor:pointer}
.ipic img{max-width:100%;border-radius:8px;margin:6px 0}
.ifix{color:var(--ok);font-weight:600;margin-top:6px}
/* ---- jeux ---- */
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.gchips .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gwrap{display:grid;grid-template-columns:1fr;gap:16px}
.gwrap .card{margin-bottom:8px}
.gplay{display:none}
.gplay.open{display:flex;flex-direction:column;position:fixed;inset:0;z-index:20;background:var(--bg);padding:8px;height:100dvh}
.gplay .gbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.gplay .gbar .sec{flex:1}
.phone{flex:1;width:100%;max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.phone iframe{border:0;width:100%;height:100%;display:block}
.gplaybtn{width:100%;padding:12px;font-size:16px;margin-bottom:12px}
@media (min-width:980px){
  .gwrap{grid-template-columns:minmax(0,1fr) 380px}
  .gplay,.gplay.open{display:flex;flex-direction:column;position:sticky;top:12px;height:calc(100dvh - 140px);padding:0;z-index:auto;inset:auto}
  .gplay .gclose,.gplaybtn{display:none}
  .phone{max-width:none}
}
/* ---- enregistrement (studio), téléphone d'abord ---- */
.noscroll{overflow:hidden}
.bigstart{width:100%;padding:13px;font-size:16px;margin-bottom:12px}
.recrow{margin:4px 0}
.warnc{color:var(--warn)}
.opts{background:var(--grey-l);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px}
.studio{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;max-width:720px;margin:0 auto;height:100dvh}
.st-top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.st-top select{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card);font-size:13px;max-width:46%}
.st-head{padding:8px 14px 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.studio .flag{margin:6px 14px 0;font-size:13px}
.stext{flex:1;overflow-y:auto;padding:8px 16px 12px;-webkit-overflow-scrolling:touch}
.readbig{font-size:22px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.readbig2{font-size:19px}
.instr{color:var(--muted);font-style:italic;font-size:.75em}
.frgloss{margin:12px 0 6px;color:var(--muted);font-size:14px}
.st-ctl{background:var(--card);border-top:1px solid var(--line);padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
.st-msg{font-size:14px}.st-msg.bad{color:var(--bad);font-weight:700;padding:4px 0}
.st-status{font-size:13px;color:var(--muted);min-height:18px}
.st-status .err{color:var(--bad);font-weight:600}
.st-meter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0;font-variant-numeric:tabular-nums;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--grey-l);flex:none}
.dot.on{background:#E0322B;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#meter{flex:1;height:8px;background:var(--grey-l);border-radius:4px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.st-btns{display:flex;justify-content:space-around;align-items:center;margin:4px 0}
.round{border-radius:50%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:30px;line-height:1;touch-action:manipulation}
.round small{font-size:11px;font-weight:700;margin-top:3px}
.round.rec{width:86px;height:86px;background:#D93025;box-shadow:0 0 0 6px rgba(217,48,37,.22)}
.round.stop{width:86px;height:86px;background:var(--ink);color:var(--bg)}
.round.side{width:56px;height:56px;background:var(--grey-l);color:var(--ink);font-size:24px}
.round:disabled{opacity:.3}
.st-row2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.st-row2 .btn{padding:10px 12px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.on-ok{background:var(--ok-l);color:var(--ok);border-color:var(--ok)}
.on-bad{background:var(--bad-l);color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%;padding:13px;font-size:17px}
/* ---- aperçu ---- */
.pvtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pvtop select{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.phone{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;touch-action:pan-y}
.pbar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line)}
.pbar .nm{font-family:ui-monospace,Menlo,monospace}
.psec{font-size:12px;font-weight:700;color:var(--brand-d);padding:8px 14px 0;text-transform:uppercase;letter-spacing:.4px}
.pscr{padding:10px 14px 16px;min-height:300px}
.pq{margin-bottom:14px}
.pqt{font-size:17px;line-height:1.45}
.phint{color:var(--muted);font-size:14px;margin-top:4px}
.paud{margin:8px 0}
.pvno{background:var(--bad-l);color:var(--bad)}
.popt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:15.5px}
.popt img{width:48px;height:48px;object-fit:contain;flex:none}
.prad,.pchk{width:18px;height:18px;border:2px solid var(--muted);flex:none}.prad{border-radius:50%}.pchk{border-radius:4px}
.pinp{border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--muted);display:flex;justify-content:space-between}
.pinp.tall{height:64px}
.pgame{border:2px dashed var(--brand);border-radius:12px;padding:24px 10px;text-align:center}
.pmeta{font-size:11.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:5px;overflow-wrap:anywhere}
.pbox{border:2px solid var(--muted);padding:8px;border-radius:6px}.pbig{font-size:1.9em;font-weight:700}.pvar{color:var(--info)}
img.plab{max-width:100px;display:block;margin:6px 0}
.pnav{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:12px auto 0}
.st-name{margin:4px 0 8px}
.frbox{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.45;border-left:3px solid var(--line);padding-left:10px}
.st-meter .st-status{font-size:13px;color:var(--ok);font-weight:600;min-height:0}
.mdhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.mdmin{font-weight:700;color:var(--brand-d)}
.mdfacts{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.mdcard.md-garder{border-left:5px solid var(--ok)}
.mdcard.md-couper{border-left:5px solid var(--bad);opacity:.7}
.mdcard.md-discuter{border-left:5px solid var(--warn)}
.mddec[data-v="garder"][aria-pressed="true"]{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.mddec[data-v="couper"][aria-pressed="true"]{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.mdnotes{margin-top:8px;font-size:13.5px}
.mdnotes summary{cursor:pointer;color:var(--brand-d);font-weight:600}
.mdnote{border-top:1px solid var(--line);padding:6px 0}
.mdadd{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.mdadd textarea{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card);color:var(--ink)}
/* ---- plan baseline ---- */
.plrole{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.r-primary{background:var(--brand);color:#fff}
.r-mechanism{background:var(--info-l);color:var(--info)}
.r-agency{background:var(--brand-l);color:var(--brand-d)}
.r-secondary{background:var(--warn-l);color:var(--warn)}
.r-harm{background:var(--ink);color:var(--bg)}
.r-background,.r-control,.r-setup{background:var(--grey-l);color:var(--muted)}
.plvoice{border:1px dashed var(--brand);border-radius:12px;padding:9px 12px;margin:0 0 8px 18px;font-style:italic;color:var(--brand-d);font-size:14.5px}
.plgrp.regles{border-left:5px solid var(--brand)}
.plwhy{font-size:14px;color:var(--muted);padding:10px 14px 0}
.plq{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 10px}
.plq .ch{margin-bottom:4px}
.plfr{font-size:15px}
.plmg{font-size:14.5px;color:var(--muted);margin-top:4px;border-left:3px solid var(--line);padding-left:8px}
.plmg.none{color:var(--warn);border-left-color:var(--warn)}
.plch{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.plch span{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12.5px;color:var(--muted)}
.plnote{font-size:13px;color:var(--warn);margin-top:4px}
.plen{font-size:14.5px;color:var(--info);margin-top:4px;border-left:3px solid var(--info-l);padding-left:8px}
.plkid{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.plkh{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 8px}
.plopt{font-size:14px;margin:4px 0;background:var(--card)}
.plopt img{width:40px;height:40px}
.plkid img.plab{max-width:240px;width:100%}
.plo2{color:var(--muted)}.plo2.en{color:var(--info)}
.st-keep{background:var(--ok-l);color:var(--ok)}
.st-reenable{background:var(--info-l);color:var(--info)}
.st-new{background:var(--brand-l);color:var(--brand-d)}
.st-rewrite{background:var(--warn-l);color:var(--warn)}
.mdnote.res{opacity:.55}
.mdnote.res .ntxt{text-decoration:line-through}
.plmods{padding-bottom:4px}
.pllist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pllist span{background:var(--grey-l);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:13px;text-decoration:line-through}
.plflow{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:4px 0 14px;background:var(--bg)}
.plflow h3{margin:0 0 8px;font-size:15px}
.flw{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 4px}
.fst{border:0;cursor:pointer;white-space:normal;text-align:left;font:inherit;border-radius:10px;padding:6px 9px;min-width:84px;max-width:170px;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.fst b{font-size:13.5px}.fst small{font-size:12px;opacity:.85}
.fst:hover{outline:2px solid var(--brand)}
.plgrp{scroll-margin-top:110px}
.fst.r-background,.fst.r-control,.fst.r-setup{border:1px solid var(--line)}
.far{align-self:center;color:var(--muted);font-size:15px;padding:0 1px}
.fvo{align-self:center;font-size:15px}
.fblk{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 4px;border:2px dashed var(--brand);border-radius:12px;padding:20px 6px 6px;position:relative}
.fblk>.fbt{position:absolute;top:2px;left:9px;font-size:11.5px;font-weight:700;color:var(--brand-d);text-transform:uppercase;letter-spacing:.05em}
.fbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px;gap:2px}
.fbar span{display:block;height:100%}
.flg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--muted)}
.flg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.todohead{background:var(--grey-l);border-radius:12px;padding:10px 12px;margin:8px 0}
.todohead .big{font-size:18px;margin:2px 0 6px}
.todohead .mbar{display:block;width:100%;height:10px}
.todohead table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.todohead td,.todohead th{padding:4px 2px;border-bottom:1px solid var(--line,#ddd);text-align:left}
.todohead td.n{text-align:right;white-space:nowrap}
.todohead tr.tdone td{opacity:.55}
.todohead summary{cursor:pointer;font-weight:600;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// Page publique, SANS contenu: tout vient de la base avec le mot de passe de l'équipe.
const SUPA_URL = "https://sxfbzcnsbcvitaenwpct.supabase.co";
const SUPA_KEY = "sb_publishable_UFUOEVVstVLUEGs7ZzvsBw_ZIPstDkd";

const S = { who:"", key:"", tab:"audio", items:{}, filters:{}, shown:60, people:new Set() };
const TABS = [
  ["todo","✅ À faire"],["visits","🚐 Visites écoles"],["rosters","🧾 Listes de classe"],["plan","🗺 Plan baseline"],["report","📊 Rapports"],["modules","📋 Modules"],["audio","🎙 Audio enquête"],["choice","Audio choix de réponses"],["game","🎮 Jeux"],["preview","👁 Aperçu"],["issues","🛠 Problèmes"],["progress","Avancement"]];
// English for the co-authors: menu + Modules tab (the other tabs stay in French: use the browser's Translate)
S.lang = load("miara_lang")==="en" ? "en" : "fr";
const T = (fr,en) => S.lang==="en" ? en : fr;
const TABS_EN = {todo:"✅ To do",visits:"🚐 School visits",rosters:"🧾 Class lists",plan:"🗺 Baseline plan",report:"📊 Reports",modules:"📋 Modules",audio:"🎙 Survey audio",choice:"Answer audio",game:"🎮 Games",preview:"👁 Preview",
  issues:"🛠 Problems",progress:"Progress"};
const tabName = (k,t) => S.lang==="en" ? (TABS_EN[k]||t) : t;
const ST_TEXT = [["vide","Vide"],["brouillon","Brouillon"],["a_revoir","À revoir"],["valide","Validé"]];
const ST_AUDIO = [["a_enregistrer","À enregistrer"],["enregistre","Enregistré"],["verifie","Vérifié"],["a_corriger","À corriger"]];
const LABEL = Object.fromEntries([...ST_TEXT,...ST_AUDIO]);
const FIELD = {label:"Question / texte", hint:"Aide (hint)", "constraint message":"Message d'erreur", text:"", audio_script_mg:"Audio"};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k,v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
function load(k){ try{ return localStorage.getItem(k) || "" }catch(e){ return "" } }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2600) }
function when(iso){ if(!iso) return ""; const d=new Date(iso);
  return d.toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Indian/Antananarivo"}) }
function light(t){ // *italique*, **gras**, {ref:x} → affichage
  let s=esc(t).replace(/\{ref:[\w-]+\}/g,"…").replace(/\*\*(.+?)\*\*/gs,"<b>$1</b>").replace(/\*(.+?)\*/gs,"<i>$1</i>");
  return s }
function vars(t){ return (String(t).match(/\$\{[^}]+\}/g)||[]).sort().join(" ") }

function aapi(body){ return api(body,"miara_audio_api") }
// boys clips: id audio:boys.<clip>. "Lié" = same words as a girls clip, already recorded → nothing to do.
const isBoy = i => String(i?.id||"").startsWith("audio:boys.");
const gOf = v => (S.items.audio||[]).find(x=>x.id==="audio:"+v);
const linkOf = i => { const m=isBoy(i) && /^= filles · (.+)$/.exec(i.ref||""); return m?m[1]:"" };
// ✅ À faire (Ianja, phone): only the cards that still need work (text not checked, not recorded, not checked by ear),
// 🔗 cards hidden (recorded on the girls card), `code` first, then survey order (girls, then boys). A done card leaves.
S.view = "all";
const isTodoView = () => S.tab==="audio" && S.view==="todo";
const needsWork = i => !linkOf(i) && !allOk(i);
const navOn = k => k==="todo" ? isTodoView() : (k===S.tab && !(k==="audio" && isTodoView()));
const codeFirst = l => l.slice().sort((a,b)=>(b.id==="audio:code")-(a.id==="audio:code"));
async function api(body,fn="miara_api"){
  const r = await fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({body:{...body,key:S.key,who:S.who}})});
  if(!r.ok) throw new Error("Réseau: "+r.status);
  return r.json();
}

// ---------------------------------------------------------------- connexion
function loginView(msg){
  $("#app").innerHTML = `<form class="login" id="lf">
    <h1>Console MIARA-DIA</h1><p>Enquête · guide · audios · avancement</p>
    <label for="lw">Votre prénom · Your first name</label><input id="lw" autocomplete="name" required value="${esc(load("miara_who"))}">
    <label for="lk">Mot de passe de l'équipe · Team password</label><input id="lk" type="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="btn primary" style="width:100%">Entrer</button></div>
    ${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lf").onsubmit = async e => { e.preventDefault();
    S.who=$("#lw").value.trim(); S.key=$("#lk").value.trim();
    try{ const r=await api({action:"ping"});
      if(!r.ok) return loginView("Mot de passe incorrect.");
      store("miara_who",S.who); store("miara_key",S.key); shell(); Q.load(); RQ.load();
    }catch(err){ loginView("Pas de connexion internet ? "+err.message) } };
}

function shell(){
  $("#app").innerHTML = `<header><div class="top"><div class="logo">MIARA-DIA <small>console</small></div>
    <div class="who"><span id="qbadge"></span><span id="rqbadge"></span><button class="link" id="lang" title="Français / English">${S.lang==="en"?"FR":"EN"}</button>👤 ${esc(S.who)} <button class="link" id="out">${T("changer","log out")}</button></div></div>
    <nav>${TABS.map(([k,t])=>`<button data-t="${k}" class="${navOn(k)?"on":""}">${tabName(k,t)}${k==="issues"?` <span class="nbadge" id="ibadge" hidden></span>`:""}</button>`).join("")}</nav></header>
    <main id="main"></main>`;
  $("#out").onclick=()=>{ store("miara_key"); S.key=""; loginView() };
  $("#lang").onclick=()=>{ S.lang=S.lang==="en"?"fr":"en"; store("miara_lang",S.lang); shell() };
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; S.view="all"; S.shown=60; store("miara_tab",S.tab);
    if(S.tab==="todo"){ S.tab="audio"; S.view="todo" }
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b)); render(true) });
  render(true); Q.badge(); isLoad().catch(()=>{});
}

async function render(reload){
  const m=$("#main");
  if(S.tab==="progress") return progressView(m);
  if(S.tab==="visits") return visitsView(m);
  if(S.tab==="report") return reportView(m);
  if(S.tab==="rosters") return rostersView(m,reload);
  if(S.tab==="preview") return previewView(m);
  if(S.tab==="issues") return issuesView(m);
  if(S.tab==="modules"){ if(reload) MD.data=null; return modulesView(m) }
  if(S.tab==="plan"){ if(reload) PL.data=null; return planView(m) }
  if(S.tab==="recent") return recentView(m);
  if(reload || !S.items[S.tab]){
    m.innerHTML=`<div class="loading">Chargement…</div>`;
    try{ const r=await api({action:"list",kind:S.tab});
      if(!r.ok){ if(r.error==="mot_de_passe") return loginView("Le mot de passe a changé."); throw new Error(r.error) }
      S.items[S.tab]=r.items;
      r.items.forEach(i=>{ if(i.assignee) S.people.add(i.assignee); if(i.by) S.people.add(i.by) });
      if(S.tab==="audio") await loadTakes();
    }catch(e){ m.innerHTML=`<div class="empty">Erreur: ${esc(e.message)} <button class="btn small" onclick="render(true)">Réessayer</button></div>`; return }
  }
  S.tab==="game" ? gameView(m) : listView(m);
}

// ---------------------------------------------------------------- listes
const HELP = {
  audio:`1. Relisez le malgache. Bon ? <b>✓ Texte prêt</b>.<br>
   2. <b>●</b> enregistrer · <b>■</b> arrêter · <b>▶</b> écouter. Bon ? <b>✓ Audio prêt</b>. Pas bon ? <b>●</b> pour refaire.<br>
   Lisez seulement le malgache (pas les [crochets]). Après « — », lisez aussi les réponses.<br>
   <b>Garçons</b>: sections « Garçons · … » (en bas). « 🔗 Clip des filles » = même texte que les filles: on l'enregistre une fois, sur la carte des filles.`,
  survey:`Relisez le malgache. Corrigez si besoin, puis <b>✓ Texte prêt</b>. Ne changez pas <code>\${…}</code>.`,
  choice:`Les réponses (Oui / Non, échelles…). Elles s'affichent en boutons et sont lues à la fin des clips, après « — ». Corrigez le malgache ici une seule fois, puis <b>✓ Texte prêt</b>.`,
  game:`Corrigez le malgache, puis <b>✓ Texte prêt</b>. Jouez à droite (sur téléphone: <b>▶ Jouer</b>) pour voir vos textes dans le jeu, même pas encore sauvegardés.<br>
   Gardez <code>{n} {total} {i} {len} {side}</code> tels quels (ils deviennent des nombres ou des mots). Gardez les paires <code>&lt;b&gt;…&lt;/b&gt;</code> (gras).
   Le titre des images Raven est dessiné dans les images: gardez-le court. Il change seulement après la mise à jour par Oscar.`,
  curriculum:`Écrivez le malgache, puis <b>✓ Texte prêt</b>. <code>*mot*</code> = italique, <code>**mot**</code> = gras.`};
HELP.todo = `Ici: seulement ce qui reste à faire, dans l'ordre de l'enquête (filles, puis garçons). Arrêtez quand vous voulez.<br>
   Pour chaque carte: <b>1.</b> Lisez le malgache. Corrigez si besoin (<b>Sauvegarder</b>), puis <b>✓ Texte prêt</b>.
   <b>2.</b> <b>●</b> enregistrer, <b>▶</b> écouter, puis <b>✓ Audio prêt</b>. Les deux faits = la carte disparaît.<br>
   Lisez seulement le malgache (pas les [crochets]). Après « — », lisez aussi les réponses. Téléphone: <b>🎙 Commencer</b> = un clip par écran.`;
const SHORT = {vide:"À traduire",brouillon:"À relire",a_revoir:"À relire",valide:"Texte prêt",
  a_enregistrer:"À enregistrer",a_corriger:"À refaire",enregistre:"Enregistré",verifie:"Audio prêt"};
// a linked boys card (🔗) is as far as its girls clip: recorded / ready only when the girls clip is
const gReady = lk => { const g=gOf(lk); return g ? g.status==="verifie" : !!S.takes[lk] };
const isRecorded = i => { const lk=linkOf(i); return lk ? !!S.takes[lk] : ["enregistre","verifie"].includes(i.status) };
const textOk = i => S.tab==="audio" ? !!i.text_ready : i.status==="valide";
const audioOk = i => { const lk=linkOf(i); return lk ? gReady(lk) : i.status==="verifie" };
const allOk = i => textOk(i) && (S.tab!=="audio" || audioOk(i));
S.open = S.open || {};

function filtered(){
  const f=S.filters[S.tab]||{}, q=(f.q||"").toLowerCase();
  const show = { "":()=>true, rec:i=>!isRecorded(i), text:i=>!textOk(i),
                 audio:i=>isRecorded(i)&&!audioOk(i), ready:allOk, todo:i=>!allOk(i) }[f.show||""] || (()=>true);
  const r=(S.items[S.tab]||[]).filter(i=> show(i) && (S.tab!=="game" || i.id.split(":")[1]===GM.g) && (!q || (i.fr+" "+i.mg+" "+i.ref).toLowerCase().includes(q))
    && (!isTodoView() || needsWork(i)));
  return isTodoView() ? codeFirst(r) : r;
}

function counts(list){
  const n=list.length, t=list.filter(textOk).length, r=list.filter(isRecorded).length, a=list.filter(audioOk).length;
  return {n,t,r,a};
}
function bar(x,n,cls){ return `<span class="mbar ${cls||""}"><i style="width:${n?100*x/n:0}%"></i></span>` }
function groupSum(sec){
  const list=(S.items[S.tab]||[]).filter(i=>i.section===sec), c=counts(list), audio=S.tab==="audio";
  const done = audio ? (c.t===c.n && c.a===c.n) : c.t===c.n;
  return `<span class="gname">${done?"✅ ":""}${esc(sec.replace(/^\d+ · /,""))}</span>
    <span class="gprog"><span>Texte ${c.t}/${c.n}</span>${bar(c.t,c.n)}
    ${audio?`<span>Audio ${c.a}/${c.n}</span>${bar(c.a,c.n,"a")}`:""}</span>`;
}

function listView(m){
  const all=S.items[S.tab]||[], audio=S.tab==="audio", f=S.filters[S.tab]=S.filters[S.tab]||{};
  const list=filtered(), tv=isTodoView(), secs=tv?[...new Set(list.map(i=>i.section))]:[...new Set(all.map(i=>i.section))];
  const op=S.open[S.tab]=S.open[S.tab]||new Set(), searching=!!(f.q||f.show);
  m.innerHTML = `
   ${audio?`<button class="btn primary bigstart" id="gostudio">🎙 Commencer${tv?` (${list.length} à faire)`:" à enregistrer"}</button>`:""}
   <div id="stats">${statsHtml()}</div>
   <div class="help">${tv?HELP.todo:HELP[S.tab]}</div>
   <div class="bar">
     <select id="fshow" ${tv?"hidden":""}>
       <option value="">Tout</option>
       ${audio?`<option value="text" ${f.show==="text"?"selected":""}>Texte pas prêt</option>
         <option value="rec" ${f.show==="rec"?"selected":""}>Pas encore enregistré</option>
         <option value="audio" ${f.show==="audio"?"selected":""}>À écouter (audio pas prêt)</option>`
       :`<option value="todo" ${f.show==="todo"?"selected":""}>Texte pas prêt</option>`}
       <option value="ready" ${f.show==="ready"?"selected":""}>Tout prêt</option></select>
     <input type="search" id="fq" placeholder="Chercher…" value="${esc(f.q||"")}">
   </div>
   <div id="groups">${secs.map(sec=>{ const its=list.filter(i=>i.section===sec); if(!its.length) return "";
       const open = searching || op.has(sec) || (tv && sec===secs[0]);
       return `<details class="grp" data-sec="${esc(sec)}" ${open?"open":""}><summary>${groupSum(sec)}</summary>
         <div class="gcards">${open?its.map(card).join(""):""}</div></details>` }).join("") || `<div class="empty">Rien ici.</div>`}</div>`;
  const upd=()=>{ Object.assign(f,{show:$("#fshow").value,q:$("#fq").value}); listView(m);
      const q=$("#fq"); q.focus(); q.setSelectionRange(q.value.length,q.value.length) };
  $("#fshow").onchange=upd;
  let t; $("#fq").oninput=()=>{ clearTimeout(t); t=setTimeout(upd,300) };
  if($("#gostudio")) $("#gostudio").onclick=()=>openStudio(null);
  m.querySelectorAll("details.grp").forEach(d=>d.ontoggle=()=>{
    const sec=d.dataset.sec; d.open?op.add(sec):op.delete(sec);
    const box=d.querySelector(".gcards");
    if(d.open && !box.children.length){ box.innerHTML=filtered().filter(i=>i.section===sec).map(card).join(""); wire(box) } });
  wire(m);
}

function todoTable(){
  const rows=[], by=new Map();
  (S.items.audio||[]).filter(i=>!linkOf(i)).forEach(i=>{ let r=by.get(i.section);
    if(!r){ r={sec:i.section,boy:isBoy(i),n:0,d:0}; by.set(i.section,r); rows.push(r) } r.n++; r.d+=allOk(i)?1:0 });
  const sum=l=>l.reduce((a,r)=>({n:a.n+r.n,d:a.d+r.d}),{n:0,d:0}), pct=(d,n)=>n?Math.round(100*d/n):100;
  const G=rows.filter(r=>!r.boy), B=rows.filter(r=>r.boy), g=sum(G), b=sum(B), t={n:g.n+b.n,d:g.d+b.d};
  const line=r=>`<tr class="${r.d===r.n?"tdone":""}"><td>${r.d===r.n?"✅ ":""}${esc(r.sec.replace(/^Garçons · /,""))}</td><td class="n">${r.d} / ${r.n}</td><td class="n">${pct(r.d,r.n)}%</td></tr>`;
  return `<div class="todohead"><div class="big"><b>${t.n-t.d}</b> cartes à faire · <b>${pct(t.d,t.n)}%</b> fini</div>${bar(t.d,t.n,"a")}
    <div class="sum"><span>Filles <b>${g.d}/${g.n}</b> (${pct(g.d,g.n)}%)</span><span>Garçons <b>${b.d}/${b.n}</b> (${pct(b.d,b.n)}%)</span></div>
    <details class="ptab" ${innerWidth>700?"open":""}><summary>Avancement par partie</summary><table>
    <tr><th colspan="3">Filles</th></tr>${G.map(line).join("")}<tr><th colspan="3">Garçons</th></tr>${B.map(line).join("")}</table></details></div>`;
}
function statsHtml(){
  if(isTodoView()) return todoTable();
  const all=(S.items[S.tab]||[]).filter(i=>S.tab!=="game"||i.id.split(":")[1]===GM.g), c=counts(all), audio=S.tab==="audio";
  if(audio && all.some(isBoy)){ const line=(t,l)=>{ const k=counts(l);

function wire(m){
  m.querySelectorAll(".card").forEach(c=>{
    const i=item(c.dataset.id), save=c.querySelector('[data-act="save"]');
    const dirty=()=>{ const d=[...c.querySelectorAll("[data-f]")].some(el=>fval(el)!==(i[el.dataset.f]||""));

      const w=c.querySelector("[data-w]"); const mg=c.querySelector('[data-f="mg"]').value, fr=c.querySelector('[data-f="fr"]').value;

    if(S.tab==="game") dirty();
    c.querySelectorAll("[data-f]").forEach(el=>{ el.oninput=dirty;
      el.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); if(!save.disabled) doSave(c,{}) } } });
    save.onclick=()=>doSave(c,{});
    c.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>doSave(c,{status:b.dataset.st}));
    c.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>doSave(c,{text_ready:b.dataset.tr==="1"}));

    if(ef) ef.onclick=()=>{ c.querySelector("[data-frshow]").hidden=true; const t=c.querySelector('[data-f="fr"]'); t.hidden=false; t.focus(); ef.remove() };
    const me=c.querySelector('[data-act="me"]');
    if(me) me.onclick=()=>{ c.querySelector('[data-f="assignee"]').value=S.who; doSave(c,{}) };
    const sb=c.querySelector('[data-act="studio"]');

function splitMg(mg){ const s=String(mg||""), k=s.indexOf(" — "); return k<0?[s,""]:[s.slice(0,k),s.slice(k+3)] }
function fval(el){ return el.dataset.f==="mg" && el.dataset.opts!==undefined
  ? el.value + (el.dataset.opts ? " — "+el.dataset.opts : "") : el.value }

async function doSave(c,extra){
  const i=item(c.dataset.id), body={action:"save",id:i.id,base:i.at};
  c.querySelectorAll("[data-f]").forEach(el=>{ if(fval(el)!==(i[el.dataset.f]||"")) body[el.dataset.f]=fval(el) });
  Object.assign(body,extra);

  c.style.opacity=.6;
  try{
    const r=await api(body);
    if(!r.ok && r.error==="conflit"){
      c.style.opacity=1;
      const o=r.item;
      if(confirm(`${o.by} a modifié cette ligne à ${when(o.at)}.\n\nSa version (malgache):\n${o.mg.slice(0,400)}\n\nOK = garder MA version (écrase la sienne)\nAnnuler = prendre SA version`)){
        i.at=o.at; return doSave(c,extra) }
      Object.assign(i,o); c.outerHTML=card(i); wire($("#main")); return;
    }
    if(!r.ok) throw new Error(r.error);
    for(const k of ["fr","mg","note","assignee"]) if(k in body) i[k]=body[k];
    if("text_ready" in r) i.text_ready=r.text_ready;
    i.status=r.status; i.at=r.at; i.by=S.who; i.pending=r.pending;
    if(i.assignee) S.people.add(i.assignee);
    const tmp=document.createElement("div"); tmp.innerHTML=card(i); const n=tmp.firstElementChild;
    c.replaceWith(n); wire({querySelectorAll:s=>s===".card"?[n]:[]});
    if(isTodoView() && !needsWork(i)){ n.remove(); toast("✓ Fini ! Carte suivante."); refreshProgress(i.section); return }
    refreshProgress(i.section);
    toast(Object.keys(extra).length? "Prêt ✓" : "Sauvegardé ✓");
  }catch(e){ c.style.opacity=1; toast("Pas enregistré: "+e.message) }
}

function gameWarn(fr,mg){
  if(!mg.trim()) return "Vide: le jeu montrera le texte d'origine.";
  const out=[];
  if(PH(fr)!==PH(mg)) out.push("Gardez exactement: "+(PH(fr)||"aucun {…}")+(PH(mg)?" (vous avez: "+PH(mg)+")":""));
  const o=(mg.match(/<b>/g)||[]).length, c=(mg.match(/<\/b>/g)||[]).length;
  if(o!==c) out.push("<b> et </b> ne vont pas par paires.");
  return out.join(" · ");
}
function gameTexts(){
  const t={};
  (S.items.game||[]).filter(i=>i.id.split(":")[1]===GM.g).forEach(i=>{ t[i.id.split(":")[2]]=i.mg });
  document.querySelectorAll("#gcards .card").forEach(c=>{      // aussi le texte pas encore sauvegardé

// search index: every screen of the survey + audio clips + answers + game texts
async function isIndex(){
  if(IS.idx) return IS.idx;
  const jobs=[];
  if(!PV.layout) jobs.push(api({action:"layout"},"miara_preview_api").then(r=>{ if(r.ok){ PV.layout=r.data; PV.built=r.built_at } }));
  for(const k of ["survey","audio","choice","game"]) if(!S.items[k]) jobs.push(api({action:"list",kind:k}).then(r=>{ if(r.ok) S.items[k]=r.items }));
  await Promise.all(jobs);
  const idx=[];
  (PV.layout?.screens||[]).forEach(s=>{ if(!s.rows) return;
    const txt=s.rows.map(r=>[r.name,pvText(r.id,r.fr,r.mg),r.fr,r.mg,r.hfr,r.hmg,
      ...((r.w&&r.w.opts)||[]).flatMap(o=>[o.fr,o.mg])].join(" ")).join(" ");
    idx.push({...isTargetOfScreen(s), t:norm(s.name+" "+txt)}) });

// phone photos are big: max 1400 px, JPEG
function shrink(file){
  return new Promise((ok,ko)=>{ const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,1400/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); ok({mime:"image/jpeg",data:c.toDataURL("image/jpeg",.82).split(",")[1]}) };
    img.onerror=()=>{ URL.revokeObjectURL(u); ko(new Error("image")) }; img.src=u });
}

// ---------------------------------------------------------------- 🧾 listes de classe (school → class → photos of the student list)
// These photos HAVE STUDENT NAMES (Oscar's decision, 24 Nov 2026). Supabase is only a transit point:
// console/pull_rosters.py copies them to Dropbox data/student_lists/ (--purge removes them from Supabase).
// Offline first: a new list waits on the phone (IndexedDB "miara_rosters") and is sent when the network is back.
const GRADES=["4e","3e"];        // baseline: only 4e and 3e (Oscar, 24 Nov 2026)
const ALL_GRADES=["6e","5e","4e","3e"];   // order of the plan's student counts
const RS={data:null,plan:null,offline:false};
const rapi=body=>api(body,"miara_roster_api");
const rid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const RQ={items:[],db:null,busy:false,t:0,err:"",pct:0,cur:"",
  async open(){ if(this.db!==null) return this.db;
    try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open("miara_rosters",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"cid"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error) }) }
    catch(e){ this.db=false } return this.db },
  async load(){ const db=await this.open(); if(!db) return;
    const all=await new Promise(res=>{ try{ const t=db.transaction("q").objectStore("q").getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]) }catch(e){ res([]) } });
    for(const it of all) if(!this.items.some(x=>x.cid===it.cid)) this.items.push(it);
    this.badge(); if(this.items.length) this.run() },
  async save(it){ if(!this.items.includes(it)) this.items.push(it); const db=await this.open();
    if(db) try{ await new Promise((res,rej)=>{ const t=db.transaction("q","readwrite"); t.objectStore("q").put(it); t.oncomplete=res; t.onerror=()=>rej(t.error) }) }catch(e){}
    this.badge() },
  async del(cid){ this.items=this.items.filter(x=>x.cid!==cid); const db=await this.open();
    if(db) try{ db.transaction("q","readwrite").objectStore("q").delete(cid) }catch(e){} this.badge() },
  left(){ return this.items.reduce((a,x)=>a+x.files.filter(f=>!f.done).length,0) },
  badge(){ const b=$("#rqbadge"); if(!b) return; const n=this.items.length;
    b.innerHTML=n?`<span class="chip s-a_corriger" title="Listes de classe pas encore envoyées">⏳ ${n} liste${n>1?"s":""} à envoyer</span> `:"" },
  up(){ if(S.tab==="rosters") rqBox() },
  async run(){ if(this.busy||!S.key||!this.items.length) return; this.busy=true; clearTimeout(this.t); this.err="";
    try{ for(const it of [...this.items]){
        this.cur=it.cid; this.pct=0; this.up();
        const c=await rapi({action:"save_class",school:it.school,cisco:it.cisco,grade:it.grade,section:it.section,...it.fields});
        if(!c.ok){ if(c.error==="mot_de_passe"){ this.err="Mot de passe changé : reconnectez-vous."; throw new Error("stop") }
          if(c.error==="classe"){ toast("Liste refusée (niveau ou classe manquant)"); await this.del(it.cid); continue }
          throw new Error(c.error) }
        for(const f of it.files){ if(f.done) continue;
          this.cur=f.cid; this.pct=0; this.up();
          const data=await blobB64(f.blob);
          const r=await xhrPost("miara_roster_api",{action:"upload",key:S.key,who:it.who||S.who,class_id:c.id,
                                 cid:f.cid,mime:f.mime,name:f.name,data},p=>{ this.pct=p; this.up() });
          if(!r.ok){ if(r.error==="mot_de_passe"){ this.err="Mot de passe changé : reconnectez-vous."; throw new Error("stop") }
            if(["vide","trop_grand"].includes(r.error)){ toast(f.name+" refusé ("+r.error+")"); f.done=true; f.blob=null; await this.save(it); continue }
            throw new Error(r.error) }
          f.done=true; f.blob=null; await this.save(it) }
        await this.del(it.cid); RS.data=null; toast(`${it.grade} ${it.section} envoyée ✓`);
        if(S.tab==="rosters") rostersView($("#main"),true) }
    }catch(e){ if(e.message!=="stop"){ this.err="Pas encore envoyé ("+(e.message||"pas de réseau")+"). Nouvel essai dans 15 secondes.";
        this.t=setTimeout(()=>this.run(),15000) } }
    finally{ this.busy=false; this.cur=""; this.up() } } };
window.addEventListener("online",()=>RQ.run());
window.addEventListener("beforeunload",e=>{ if(RQ.db===false && RQ.items.length){ e.preventDefault(); e.returnValue="" } });

// phone photo of a paper list: keep it readable (max 2200 px, JPEG 0.8 ≈ 300-600 KB)
function shrinkList(file){
  return new Promise((ok,ko)=>{ const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,2200/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):ko(new Error("image")),"image/jpeg",.8) };
    img.onerror=()=>{ URL.revokeObjectURL(u); ko(new Error("image")) }; img.src=u });
}

// schools = visit plan + already visited + any school that has data (+ one typed by the team)
function rSchools(){
  const map=new Map();
  const add=(school,cisco,est)=>{ if(!school) return; const x=map.get(school)||{school,cisco:"",est:null};
    if(cisco&&!x.cisco) x.cisco=cisco; if(est) x.est=est; map.set(school,x) };
  if(RS.plan){ const cs=RS.plan.class_size||50;
    (RS.plan.days||[]).forEach(d=>d.teams.forEach(t=>t.stops.forEach(s=>
      add(s.school,s.cisco,Object.fromEntries(GRADES.map(g=>[g,Math.ceil(((s.grades||[])[ALL_GRADES.indexOf(g)]||0)/cs)]))))));
    (RS.plan.visited||[]).forEach(v=>add(v.school,v.cisco)) }
  else try{ JSON.parse(load("miara_rschools")||"[]").forEach(s=>add(s.school,s.cisco,s.est)) }catch(e){}
  (RS.data?.schools||[]).forEach(s=>add(s.school,s.cisco));
  (RS.data?.classes||[]).forEach(c=>add(c.school,c.cisco));
  RQ.items.forEach(it=>add(it.school,it.cisco));
  const cur=load("miara_rschool"); if(cur) add(cur,"");
  const list=[...map.values()].sort((a,b)=>a.school.localeCompare(b.school,"fr"));
  store("miara_rschools",JSON.stringify(list));     // school names only (no students): lets the tab work offline
  return list;
}

  $("#rsheet")?.remove();
  const d=document.createElement("div"); d.className="sheet"; d.id="rsheet";
  const title=mode==="edit"?`Modifier ${c.grade} ${c.section}`:mode==="add"?`Ajouter des photos · ${c.grade} ${c.section}`:"Nouvelle liste de classe";
  let grade=c?.grade||""; const files=[];
  d.innerHTML=`<div class="sheetbox" role="dialog" aria-label="${esc(title)}">
    <div class="st-top"><b>${esc(title)}</b><button class="btn" data-x>✕</button></div>
    <div class="sheetbody">
      <div class="sec" style="margin-bottom:8px">🏫 ${esc(sc.school)}</div>
      ${mode==="add"?"":`
        <div class="lang">Niveau</div>
        <div class="tchips" style="margin-bottom:10px">${GRADES.map(g=>`<button class="tchip" data-g="${g}" aria-pressed="${g===grade}">${g}</button>`).join("")}</div>
        <label class="lang" for="rsec">Classe (lettre ou numéro, comme l'école l'écrit)</label>
        <input id="rsec" type="text" maxlength="20" placeholder="A" autocapitalize="characters" value="${esc(c?.section||"")}">
        <div class="rrow"><div><label class="lang" for="rn">Nombre d'élèves</label><input id="rn" type="number" min="1" max="250" inputmode="numeric" value="${c?.n??""}"></div>
          <div><label class="lang" for="rg">dont filles</label><input id="rg" type="number" min="0" max="250" inputmode="numeric" value="${c?.girls??""}"></div></div>`}
      ${mode==="edit"?"":`
        <div class="lang">Photos de la liste (toutes les pages)</div>
        <div class="foot" style="margin-top:4px"><label class="btn primary">📷 Prendre une photo<input type="file" id="rcam" accept="image/*" capture="environment" hidden></label>
          <label class="btn">🖼 Choisir (photos, PDF, Excel)<input type="file" id="rpick" accept="image/*,application/pdf,.pdf,.xlsx,.xls,.csv,.doc,.docx" multiple hidden></label></div>
        <div id="rfiles" class="rthumbs"></div>`}
      ${mode==="add"?"":`<label class="lang" for="rnote">Note (facultatif)</label>
        <input id="rnote" type="text" maxlength="500" placeholder="Ex. : liste du 25 nov., 2 élèves partis" value="${esc(c?.note||"")}">`}
      <div class="sec" id="rdup"></div>
      <div class="err" id="rerr"></div>
      <button class="btn primary" id="rsend" style="width:100%;margin-top:12px;padding:12px;font-size:16px">${mode==="edit"?"Enregistrer":"Envoyer"}</button>
    </div></div>`;
  document.body.appendChild(d); document.body.classList.add("noscroll");
  const close=()=>{ files.forEach(f=>f.url&&URL.revokeObjectURL(f.url)); d.remove(); document.body.classList.remove("noscroll") };
  d.querySelector("[data-x]").onclick=close;
  d.onclick=e=>{ if(e.target===d && (!files.length || confirm("Fermer sans envoyer ?"))) close() };
  const sec=()=>($("#rsec")?.value||c?.section||"").trim().toUpperCase().replace(/\s+/g," ");
  const dup=()=>{ const el=$("#rdup"); if(!el||mode!=="new") return;
    const x=D.classes.find(y=>y.school===sc.school&&y.grade===grade&&y.section===sec());
    el.textContent=x?`${grade} ${sec()} existe déjà : les photos seront ajoutées à cette classe.`:"" };
  d.querySelectorAll(".tchip[data-g]").forEach(b=>b.onclick=()=>{ grade=b.dataset.g;
    d.querySelectorAll(".tchip[data-g]").forEach(x=>x.setAttribute("aria-pressed",x===b)); dup() });
  $("#rsec")?.addEventListener("input",dup);
  const show=()=>{ const el=$("#rfiles"); if(!el) return;
    el.innerHTML=files.map((f,k)=>`<div class="rft">${f.url?`<img src="${f.url}" alt="Page ${k+1}">`:`📄 ${esc(f.name)}`}
      <button class="rx" data-k="${k}" aria-label="Enlever">✕</button><div class="sec">Page ${k+1}</div></div>`).join("");
    el.querySelectorAll(".rx").forEach(b=>b.onclick=()=>{ const f=files.splice(+b.dataset.k,1)[0]; if(f?.url) URL.revokeObjectURL(f.url); show() }) };
  const addFiles=async list=>{ const err=$("#rerr"); err.textContent="";
    for(const file of list){
      let blob=file, mime=file.type||"application/octet-stream", name=file.name||"photo.jpg";
      if(/^image\//.test(mime)||/\.(heic|heif)$/i.test(name)){
        try{ blob=await shrinkList(file); mime="image/jpeg"; name=name.replace(/\.\w+$/,"")+".jpg" }
        catch(e){ /* not readable here (HEIC on Chrome…): send the original */ } }
      if(blob.size>15e6){ err.textContent=name+" est trop grand (max 15 Mo)."; continue }
      files.push({cid:rid(),blob,mime,name,done:false,url:mime==="image/jpeg"||/^image\/(png|webp|gif)/.test(mime)?URL.createObjectURL(blob):""}) }
    show() };
  ["rcam","rpick"].forEach(id=>{ const i=$("#"+id); if(i) i.onchange=async e=>{ await addFiles([...e.target.files]); e.target.value="" } });
  $("#rsend").onclick=async()=>{
    const err=$("#rerr"), b=$("#rsend"), num=id=>{ const v=$("#"+id)?.value; return v===""||v==null?null:parseInt(v,10) };
    if(mode!=="add"){
      if(!grade) return err.textContent="Choisissez le niveau (4e ou 3e).";
      if(!sec()) return err.textContent="Écrivez la classe (A, B, 1…).";
      if(num("rg")!=null&&num("rn")!=null&&num("rg")>num("rn")) return err.textContent="Plus de filles que d'élèves ?" }
    if(mode==="edit"){
      b.disabled=true;
      try{ const r=await rapi({action:"save_class",id:c.id,grade,section:sec(),n:num("rn"),girls:num("rg"),note:$("#rnote").value.trim()});
        if(!r.ok) throw new Error(r.error); close(); toast("Enregistré ✓"); rostersView($("#main"),true) }
      catch(e){ b.disabled=false; err.textContent="Pas enregistré : "+e.message+(String(e.message).includes("409")?" (cette classe existe déjà)":" (réseau ?)") }
      return }
    if(!files.length) return err.textContent="Ajoutez au moins une photo de la liste.";
    const fields={};
    if(mode==="new"){ if(num("rn")!=null) fields.n=num("rn"); if(num("rg")!=null) fields.girls=num("rg");
      const note=$("#rnote").value.trim(); if(note) fields.note=note }
    const it={cid:rid(),school:sc.school,cisco:sc.cisco||"",grade:mode==="add"?c.grade:grade,section:mode==="add"?c.section:sec(),
      fields,who:S.who,at:Date.now(),files:files.map(({cid,blob,mime,name})=>({cid,blob,mime,name,done:false}))};
    b.disabled=true; await RQ.save(it); close();
    toast("Gardée sur le téléphone · envoi…"); rostersView($("#main"),false); RQ.run() };
}

const MD = { data:null, open:new Set() };
const MOD_EN = {"Consentement":"Consent","Entraînement":"Practice","Partie 1 · GAD (anxiété)":"Part 1 · GAD (anxiety)",
  "Partie 2 · CES-D (humeur)":"Part 2 · CES-D (mood)","Partie 3 · PSS / PSC":"Part 3 · PSS / PSC","Partie 4 · Attitudes":"Part 4 · Attitudes",

  "Jeu 3 · Calcul rapide":"Game 3 · Quick maths","Jeux de réflexion (intros)":"Thinking games (intros)",

  "Jeu des carrés (Corsi)":"Squares game (Corsi)","Jeu des nombres (magnitude)":"Numbers game (magnitude)",

const DEC = [["garder","✓ Garder","✓ Keep"],["couper","✕ Couper","✕ Cut"],["discuter","? À discuter","? Discuss"]];
const mapi = body => api(body,"miara_module_api");
function modName(k){ const n=k.replace(/^[\d.]+ · /,""); return S.lang==="en" ? (MOD_EN[n]||n) : n }

async function modulesLoad(){
  const jobs=[mapi({action:"list"}), isLoad().catch(()=>null)];
  for(const k of ["survey","audio","game"]) if(!S.items[k]) jobs.push(api({action:"list",kind:k}).then(r=>{ if(r.ok) S.items[k]=r.items }));
  const [r]=await Promise.all(jobs);
  if(!r.ok){ if(r.error==="mot_de_passe") return loginView("Le mot de passe a changé."); throw new Error(r.error) }
  MD.data=r;
}
function modulesRows(){
  const rows={}, of={}, row=k=>rows[k]=rows[k]||{key:k,q:new Set(),txt:[0,0],aud:[0,0],gtx:[0,0],iss:0};
  (S.items.survey||[]).forEach(i=>{ if(/^99 /.test(i.section)) return; row(i.section).q.add(i.id.split(":")[1]); of[i.id]=i.section });
  (S.items.audio||[]).forEach(i=>{ if(/^99 /.test(i.section) || isBoy(i)) return; const r=row(i.section);
    r.txt[1]++; r.txt[0]+=!!i.text_ready; r.aud[1]++; r.aud[0]+=i.status==="verifie"; of[i.id]=i.section });
  (S.items.game||[]).forEach(i=>{ const k="14."+i.section, r=row(k); r.q.add(i.id); r.gtx[1]++; r.gtx[0]+=i.status==="valide"; of[i.id]=k });
  (IS.list||[]).forEach(x=>{ if(x.status==="ouvert" && of[x.item_id]) row(of[x.item_id]).iss++ });
  const num=k=>parseFloat(k.replace(/ · .*/,"")); 
  return Object.values(rows).sort((a,b)=>num(a.key)-num(b.key) || a.key.localeCompare(b.key));
}

  const sum=w=>rows.filter(r=>decOf(r.key)===w).reduce((a,r)=>a+(minOf(r.key)||0),0);
  const kept=sum("garder"), disc=sum("discuter"), none=rows.filter(r=>!decOf(r.key)).length;
  const noMin=rows.filter(r=>decOf(r.key)==="garder" && minOf(r.key)==null && !/^14\.\d/.test(r.key)).length;
  const over = target && kept>target;
  const notes=k=>(d.notes||[]).filter(n=>n.module===k);
  const frac=(a,cls)=>a[1]?`<span>${a[0]}/${a[1]}</span>${bar(a[0],a[1],cls)}`:"";
  m.innerHTML=`<h2 style="margin-top:0">${T("Baseline : quels modules ?","Baseline: which modules?")}</h2>
    <div class="help">${T(
      "Pour chaque module : <b>Garder</b>, <b>Couper</b> ou <b>À discuter</b>. Écrivez pourquoi en dessous. Les minutes viennent du pilote (médiane). Le total compte seulement les modules « Garder ».",
      "For each module: <b>Keep</b>, <b>Cut</b> or <b>Discuss</b>. Write why below it. Minutes come from the pilot (median). The total counts only the “Keep” modules.")}

function planFlow(mods){
  // steps: box html or {blk:[...]}; a voice line puts 🔊 on the next arrow
  const steps=[]; let blk=null, t=0, vo=null;
  const box=mo=>{ const a=t; t+=(mo.min||0);
    return {v:vo, h:`<button class="fst plrole r-${esc(mo.role)}" data-goto="${esc(mo.key)}" title="${esc(T(...(ROLE[mo.role]||[mo.role,mo.role])))}">
      <small>${esc(mo.key)} · ${T("à","at")} ${Math.round(a)} min</small><b>${esc(T(mo.fr,mo.en))}</b><small>~${fmin(mo.min)} min</small></button>`} };
  mods.forEach(mo=>{
    if(mo.voice){ vo=mo.voice; return }
    if(mo.block==="regles"){ if(!blk){ blk={v:vo,blk:[]}; vo=null; steps.push(blk) } blk.blk.push(box(mo)); vo=null; return }
    blk=null; steps.push(box(mo)); vo=null });
  const ar=(v,first)=>first?(v?`<span class="far" title="${esc(v)}">🔊</span>`:""):`<span class="far"${v?` title="${esc(v)}"`:""}>${v?"🔊→":"→"}</span>`;
  const seq=(xs,firstAr)=>xs.map((x,i)=>ar(x.v,i===0&&!firstAr)+(x.blk
    ? `<div class="fblk"><span class="fbt">${T("Bloc règles · quand la confiance est là","Periods block · once trust is built")}</span>${seq(x.blk,false)}</div>` : x.h)).join("");
  const html=seq(steps,false)+(vo?ar(vo,false).replace("→",""):"");
  const col={primary:"var(--brand)",agency:"var(--brand-l)",mechanism:"var(--info)",secondary:"var(--warn)",harm:"var(--ink)",background:"var(--grey-l)",control:"var(--grey-l)",setup:"var(--line)"};
  const real=mods.filter(mo=>!mo.voice), tot=real.reduce((a,mo)=>a+(mo.min||0),0)||1;
  const used=[...new Set(real.map(mo=>mo.role))];
  return `<div class="plflow"><h3>${T("Le déroulé de l'entretien","How the interview flows")} · ~${fmin(tot)} min</h3>
    <div class="flw">${html}</div>
    <div class="fbar">${real.map(mo=>`<span style="flex:${mo.min||0.1};background:${col[mo.role]||"var(--line)"}" title="${esc(T(mo.fr,mo.en))} · ${fmin(mo.min)} min"></span>`).join("")}</div>
    <div class="flg">${used.map(r=>`<span><i style="background:${col[r]||"var(--line)"}"></i>${T(...(ROLE[r]||[r,r]))}</span>`).join("")}<span>🔊 ${T("message de la voix (confiance)","voice message (trust)")}</span><span>${T("Cliquez une étape pour l'ouvrir","Click a step to open it")}</span></div></div>`;
}

function planWire(m){

  const en=$("#plen"); if(en) en.onchange=e=>{ PL.en=e.target.checked; store("miara_plan_en",PL.en?"1":"0"); planView(m) };
  const kd=$("#plkid"); if(kd) kd.onchange=e=>{ PL.kid=e.target.checked; store("miara_plan_kid",PL.kid?"1":"0"); planView(m) };
  m.querySelectorAll(".plplay").forEach(b=>b.onclick=()=>playTake(b.dataset.v,b));
  const all=$("#plall"); if(all) all.onclick=()=>{ const gs=[...m.querySelectorAll(".plgrp")], any=gs.some(g=>!g.open);
    gs.forEach(g=>{ g.open=any; any?PL.open.add(g.dataset.k):PL.open.delete(g.dataset.k) }) };
  m.querySelectorAll(".plgrp").forEach(g=>g.addEventListener("toggle",e=>{ if(e.target!==g) return; g.open?PL.open.add(g.dataset.k):PL.open.delete(g.dataset.k) }));
  m.querySelectorAll(".plnotes").forEach(d=>{ const q=d.dataset.q;
    d.addEventListener("toggle",e=>{ if(e.target!==d) return; d.open?PL.nopen.add(q):PL.nopen.delete(q) });
    d.querySelector(".plsend").onclick=async e=>{ const ta=d.querySelector("textarea"), t=ta.value.trim(); if(!t) return;
      e.target.disabled=true;
      try{ const r=await papi({action:"note",survey:PL.s,qid:q,text:t}); if(!r.ok) throw new Error(r.error);
        PL.nopen.add(q); const y=window.scrollY; await planLoad(); planView(m); window.scrollTo(0,y); toast(T("Commentaire envoyé","Comment sent")) }

      catch(err){ b.disabled=false; toast(T("Pas enregistré: ","Not saved: ")+err.message) } });
  });
}
