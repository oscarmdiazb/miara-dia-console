<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Console MIARA-DIA</title>
<style>
:root{
  --bg:#FBF6F2; --card:#FFFFFF; --ink:#2B2220; --muted:#7A6A64; --line:#EADBD2;
  --brand:#B45E48; --brand-d:#7D3C30; --brand-l:#FBE6DA;
  --ok:#2F7D4F; --ok-l:#E2F2E8; --warn:#9A6B00; --warn-l:#FFF3CC; --bad:#B3261E; --bad-l:#FCE4E2;
  --info:#2F5D8A; --info-l:#E3EEF8; --grey-l:#F1ECE9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1816; --card:#2A2321; --ink:#F3ECE8; --muted:#B9AAA3; --line:#463A36;
    --brand:#E0937B; --brand-d:#F2B8A5; --brand-l:#4A2E26;
    --ok:#7FD3A0; --ok-l:#1F3A2A; --warn:#F2C95C; --warn-l:#3D3216; --bad:#F2A19B; --bad-l:#4A2422;
    --info:#9CC3EA; --info-l:#1F3042; --grey-l:#352D2A;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto}
.logo{font-weight:800;color:var(--brand-d);letter-spacing:.3px}
.logo small{font-weight:500;color:var(--muted)}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:1100px;margin:0 auto}
nav button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
nav button.on{color:var(--brand-d);border-bottom-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.small{padding:4px 9px;font-size:13px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-size:13px;text-decoration:underline}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar select,.bar input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;max-width:100%}
.bar input[type=search]{flex:1;min-width:160px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{color:var(--muted);font-size:12px}
.prog{height:10px;background:var(--grey-l);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.dirty{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l)}
.ch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px;font-size:13px}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted);word-break:break-all}
.sec{color:var(--muted);font-size:12px}
.meta{margin-left:auto;color:var(--muted);font-size:12px}
.chip{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.s-vide,.s-a_enregistrer{background:var(--grey-l);color:var(--muted)}
.s-a_revoir,.s-a_corriger{background:var(--warn-l);color:var(--warn)}
.s-brouillon,.s-enregistre{background:var(--info-l);color:var(--info)}
.s-valide,.s-verifie{background:var(--ok-l);color:var(--ok)}
.flag{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:13px;margin-bottom:8px}
.pend{background:var(--brand-l);color:var(--brand-d)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.cols{grid-template-columns:1fr}
  .stat{min-width:0;flex:1 1 28%;padding:6px 8px}.stat b{font-size:17px}.stat span{font-size:11px}
  main{padding:12px}.card{padding:10px 11px}}
.lang{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.fr{white-space:pre-wrap;background:var(--grey-l);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;resize:vertical;min-height:42px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
textarea.mg{font-size:16px}
.read{font-size:18px;line-height:1.55}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.sbtns{display:flex;flex-wrap:wrap;gap:4px}
.sbtns button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.sbtns button.on{border-color:transparent}
.note{font-size:13.5px}
.warn{color:var(--bad);font-size:12.5px}
.hist{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.hist div{margin:3px 0}
.saveas{font-family:ui-monospace,Menlo,monospace;background:var(--brand-l);color:var(--brand-d);padding:2px 8px;border-radius:6px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:30px}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h1{margin:0 0 4px;color:var(--brand-d);font-size:22px}
.login p{color:var(--muted);margin:0 0 16px}
.login label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card)}
.err{color:var(--bad);margin-top:10px;font-size:14px}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:18px 0 8px}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.help summary{cursor:pointer;font-weight:600;color:var(--brand-d)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{color:var(--muted);padding:20px;text-align:center}
.sum{display:flex;gap:16px;font-size:15px;margin-bottom:4px}.sum b{font-size:20px}
.prog{position:relative}.prog i{position:absolute;left:0;top:0}.prog i.rec{background:var(--info-l)}
.help{font-size:13.5px;color:var(--muted);background:none;border:0;padding:0 2px;margin-bottom:10px}
.card.isok{opacity:.75}
.okbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.okbtn{font-weight:700}
.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.grp>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--muted);margin-right:-4px}
.grp[open]>summary::before{content:"▾"}
.grp[open]>summary{border-bottom:1px solid var(--line)}
.gname{font-weight:700;flex:1 1 200px}
.gprog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar{display:inline-block;width:46px;height:7px;background:var(--grey-l);border-radius:4px;overflow:hidden;margin-right:6px}
.mbar i{display:block;height:100%;background:var(--ok)}
.mbar.a i{background:var(--info)}
.gcards{padding:10px}
.gcards .card{margin-bottom:8px}
/* ---- enregistrement (studio), téléphone d'abord ---- */
.noscroll{overflow:hidden}
.bigstart{width:100%;padding:13px;font-size:16px;margin-bottom:12px}
.recrow{margin:4px 0}
.warnc{color:var(--warn)}
.opts{background:var(--grey-l);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px}
.studio{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;max-width:720px;margin:0 auto;height:100dvh}
.st-top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.st-top select{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card);font-size:13px;max-width:46%}
.st-head{padding:8px 14px 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.studio .flag{margin:6px 14px 0;font-size:13px}
.stext{flex:1;overflow-y:auto;padding:8px 16px 12px;-webkit-overflow-scrolling:touch}
.readbig{font-size:22px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.readbig2{font-size:19px}
.instr{color:var(--muted);font-style:italic;font-size:.75em}
.frgloss{margin:12px 0 6px;color:var(--muted);font-size:14px}
.st-ctl{background:var(--card);border-top:1px solid var(--line);padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
.st-msg{font-size:14px}.st-msg.bad{color:var(--bad);font-weight:700;padding:4px 0}
.st-status{font-size:13px;color:var(--muted);min-height:18px}
.st-status .err{color:var(--bad);font-weight:600}
.st-meter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0;font-variant-numeric:tabular-nums;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--grey-l);flex:none}
.dot.on{background:#E0322B;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#meter{flex:1;height:8px;background:var(--grey-l);border-radius:4px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.st-btns{display:flex;justify-content:space-around;align-items:center;margin:4px 0}
.round{border-radius:50%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:30px;line-height:1;touch-action:manipulation}
.round small{font-size:11px;font-weight:700;margin-top:3px}
.round.rec{width:86px;height:86px;background:#D93025;box-shadow:0 0 0 6px rgba(217,48,37,.22)}
.round.stop{width:86px;height:86px;background:var(--ink);color:var(--bg)}
.round.side{width:56px;height:56px;background:var(--grey-l);color:var(--ink);font-size:24px}
.round:disabled{opacity:.3}
.st-row2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.st-row2 .btn{padding:10px 12px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.on-ok{background:var(--ok-l);color:var(--ok);border-color:var(--ok)}
.on-bad{background:var(--bad-l);color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%;padding:13px;font-size:17px}
/* ---- aperçu ---- */
.pvtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pvtop select{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.phone{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;touch-action:pan-y}
.pbar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line)}
.pbar .nm{font-family:ui-monospace,Menlo,monospace}
.psec{font-size:12px;font-weight:700;color:var(--brand-d);padding:8px 14px 0;text-transform:uppercase;letter-spacing:.4px}
.pscr{padding:10px 14px 16px;min-height:300px}
.pq{margin-bottom:14px}
.pqt{font-size:17px;line-height:1.45}
.phint{color:var(--muted);font-size:14px;margin-top:4px}
.paud{margin:8px 0}
.pvno{background:var(--bad-l);color:var(--bad)}
.popt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;font-size:15.5px}
.popt img{width:48px;height:48px;object-fit:contain;flex:none}
.prad,.pchk{width:18px;height:18px;border:2px solid var(--muted);flex:none}.prad{border-radius:50%}.pchk{border-radius:4px}
.pinp{border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--muted);display:flex;justify-content:space-between}
.pinp.tall{height:64px}
.pgame{border:2px dashed var(--brand);border-radius:12px;padding:24px 10px;text-align:center}
.pmeta{font-size:11.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:5px;overflow-wrap:anywhere}
.pbox{border:2px solid var(--muted);padding:8px;border-radius:6px}.pbig{font-size:1.9em;font-weight:700}.pvar{color:var(--info)}
img.plab{max-width:100px;display:block;margin:6px 0}
.pnav{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:12px auto 0}
.st-name{margin:4px 0 8px}
.frbox{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.45;border-left:3px solid var(--line);padding-left:10px}
.st-meter .st-status{font-size:13px;color:var(--ok);font-weight:600;min-height:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
// Page publique, SANS contenu: tout vient de la base avec le mot de passe de l'équipe.
const SUPA_URL = "https://sxfbzcnsbcvitaenwpct.supabase.co";
const SUPA_KEY = "sb_publishable_UFUOEVVstVLUEGs7ZzvsBw_ZIPstDkd";

const S = { who:"", key:"", tab:"audio", items:{}, filters:{}, shown:60, people:new Set() };
const TABS = [
  ["audio","🎙 Audio enquête"],["choice","Audio choix de réponses"],["preview","👁 Aperçu"],["progress","Avancement"]];
const ST_TEXT = [["vide","Vide"],["brouillon","Brouillon"],["a_revoir","À revoir"],["valide","Validé"]];
const ST_AUDIO = [["a_enregistrer","À enregistrer"],["enregistre","Enregistré"],["verifie","Vérifié"],["a_corriger","À corriger"]];
const LABEL = Object.fromEntries([...ST_TEXT,...ST_AUDIO]);
const FIELD = {label:"Question / texte", hint:"Aide (hint)", "constraint message":"Message d'erreur", text:"", audio_script_mg:"Audio"};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k,v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
function load(k){ try{ return localStorage.getItem(k) || "" }catch(e){ return "" } }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2600) }
function when(iso){ if(!iso) return ""; const d=new Date(iso);
  return d.toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Indian/Antananarivo"}) }
function light(t){ // *italique*, **gras**, {ref:x} → affichage
  let s=esc(t).replace(/\{ref:[\w-]+\}/g,"…").replace(/\*\*(.+?)\*\*/gs,"<b>$1</b>").replace(/\*(.+?)\*/gs,"<i>$1</i>");
  return s }
function vars(t){ return (String(t).match(/\$\{[^}]+\}/g)||[]).sort().join(" ") }

function aapi(body){ return api(body,"miara_audio_api") }
async function api(body,fn="miara_api"){
  const r = await fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({body:{...body,key:S.key,who:S.who}})});
  if(!r.ok) throw new Error("Réseau: "+r.status);
  return r.json();
}

// ---------------------------------------------------------------- connexion
function loginView(msg){
  $("#app").innerHTML = `<form class="login" id="lf">
    <h1>Console MIARA-DIA</h1><p>Enquête · guide · audios · avancement</p>
    <label for="lw">Votre prénom</label><input id="lw" autocomplete="name" required value="${esc(load("miara_who"))}">
    <label for="lk">Mot de passe de l'équipe</label><input id="lk" type="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="btn primary" style="width:100%">Entrer</button></div>
    ${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lf").onsubmit = async e => { e.preventDefault();
    S.who=$("#lw").value.trim(); S.key=$("#lk").value.trim();
    try{ const r=await api({action:"ping"});
      if(!r.ok) return loginView("Mot de passe incorrect.");
      store("miara_who",S.who); store("miara_key",S.key); shell(); Q.load();
    }catch(err){ loginView("Pas de connexion internet ? "+err.message) } };
}

function shell(){
  $("#app").innerHTML = `<header><div class="top"><div class="logo">MIARA-DIA <small>console</small></div>
    <div class="who"><span id="qbadge"></span>👤 ${esc(S.who)} <button class="link" id="out">changer</button></div></div>
    <nav>${TABS.map(([k,t])=>`<button data-t="${k}" class="${k===S.tab?"on":""}">${t}</button>`).join("")}</nav></header>
    <main id="main"></main>`;
  $("#out").onclick=()=>{ store("miara_key"); S.key=""; loginView() };
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; S.shown=60; store("miara_tab",S.tab);
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b)); render(true) });
  render(true); Q.badge();
}

async function render(reload){
  const m=$("#main");
  if(S.tab==="progress") return progressView(m);
  if(S.tab==="preview") return previewView(m);
  if(S.tab==="recent") return recentView(m);
  if(reload || !S.items[S.tab]){
    m.innerHTML=`<div class="loading">Chargement…</div>`;
    try{ const r=await api({action:"list",kind:S.tab});
      if(!r.ok){ if(r.error==="mot_de_passe") return loginView("Le mot de passe a changé."); throw new Error(r.error) }
      S.items[S.tab]=r.items;
      r.items.forEach(i=>{ if(i.assignee) S.people.add(i.assignee); if(i.by) S.people.add(i.by) });
      if(S.tab==="audio") await loadTakes();
    }catch(e){ m.innerHTML=`<div class="empty">Erreur: ${esc(e.message)} <button class="btn small" onclick="render(true)">Réessayer</button></div>`; return }
  }
  listView(m);
}

// ---------------------------------------------------------------- listes
const HELP = {
  audio:`1. Relisez le malgache. Bon ? <b>✓ Texte prêt</b>.<br>
   2. <b>●</b> enregistrer · <b>■</b> arrêter · <b>▶</b> écouter. Bon ? <b>✓ Audio prêt</b>. Pas bon ? <b>●</b> pour refaire.<br>
   Lisez seulement le malgache (pas les [crochets]). Après « — », lisez aussi les réponses.`,
  survey:`Relisez le malgache. Corrigez si besoin, puis <b>✓ Texte prêt</b>. Ne changez pas <code>\${…}</code>.`,
  choice:`Les réponses (Oui / Non, échelles…). Elles s'affichent en boutons et sont lues à la fin des clips, après « — ». Corrigez le malgache ici une seule fois, puis <b>✓ Texte prêt</b>.`,
  curriculum:`Écrivez le malgache, puis <b>✓ Texte prêt</b>. <code>*mot*</code> = italique, <code>**mot**</code> = gras.`};
const SHORT = {vide:"À traduire",brouillon:"À relire",a_revoir:"À relire",valide:"Texte prêt",
  a_enregistrer:"À enregistrer",a_corriger:"À refaire",enregistre:"Enregistré",verifie:"Audio prêt"};
const isRecorded = i => ["enregistre","verifie"].includes(i.status);
const textOk = i => S.tab==="audio" ? !!i.text_ready : i.status==="valide";
const audioOk = i => i.status==="verifie";
const allOk = i => textOk(i) && (S.tab!=="audio" || audioOk(i));
S.open = S.open || {};

function filtered(){
  const f=S.filters[S.tab]||{}, q=(f.q||"").toLowerCase();
  const show = { "":()=>true, rec:i=>!isRecorded(i), text:i=>!textOk(i),
                 audio:i=>isRecorded(i)&&!audioOk(i), ready:allOk, todo:i=>!allOk(i) }[f.show||""] || (()=>true);
  return (S.items[S.tab]||[]).filter(i=> show(i) && (!q || (i.fr+" "+i.mg+" "+i.ref).toLowerCase().includes(q)));
}

function counts(list){
  const n=list.length, t=list.filter(textOk).length, r=list.filter(isRecorded).length, a=list.filter(audioOk).length;
  return {n,t,r,a};
}
function bar(x,n,cls){ return `<span class="mbar ${cls||""}"><i style="width:${n?100*x/n:0}%"></i></span>` }
function groupSum(sec){
  const list=(S.items[S.tab]||[]).filter(i=>i.section===sec), c=counts(list), audio=S.tab==="audio";
  const done = audio ? (c.t===c.n && c.a===c.n) : c.t===c.n;
  return `<span class="gname">${done?"✅ ":""}${esc(sec.replace(/^\d+ · /,""))}</span>
    <span class="gprog"><span>Texte ${c.t}/${c.n}</span>${bar(c.t,c.n)}
    ${audio?`<span>Audio ${c.a}/${c.n}</span>${bar(c.a,c.n,"a")}`:""}</span>`;
}

  const op=S.open[S.tab]=S.open[S.tab]||new Set(), searching=!!(f.q||f.show);
  m.innerHTML = `
   ${audio?`<button class="btn primary bigstart" id="gostudio">🎙 Commencer à enregistrer</button>`:""}
   <div id="stats">${statsHtml()}</div>
   <div class="help">${HELP[S.tab]}</div>
   <div class="bar">
     <select id="fshow">
       <option value="">Tout</option>
       ${audio?`<option value="text" ${f.show==="text"?"selected":""}>Texte pas prêt</option>
         <option value="rec" ${f.show==="rec"?"selected":""}>Pas encore enregistré</option>
         <option value="audio" ${f.show==="audio"?"selected":""}>À écouter (audio pas prêt)</option>`
       :`<option value="todo" ${f.show==="todo"?"selected":""}>Texte pas prêt</option>`}
       <option value="ready" ${f.show==="ready"?"selected":""}>Tout prêt</option></select>
     <input type="search" id="fq" placeholder="Chercher…" value="${esc(f.q||"")}">
   </div>
   <div id="groups">${secs.map(sec=>{ const its=list.filter(i=>i.section===sec); if(!its.length) return "";
       const open = searching || op.has(sec);
       return `<details class="grp" data-sec="${esc(sec)}" ${open?"open":""}><summary>${groupSum(sec)}</summary>
         <div class="gcards">${open?its.map(card).join(""):""}</div></details>` }).join("") || `<div class="empty">Rien ici.</div>`}</div>`;
  const upd=()=>{ Object.assign(f,{show:$("#fshow").value,q:$("#fq").value}); listView(m);
      const q=$("#fq"); q.focus(); q.setSelectionRange(q.value.length,q.value.length) };

function statsHtml(){
  const all=S.items[S.tab]||[], c=counts(all), audio=S.tab==="audio";
  return `<div class="sum"><span><b>${c.t}</b>/${c.n} textes prêts</span>
    ${audio?`<span><b>${c.r}</b>/${c.n} enregistrés</span><span><b>${c.a}</b>/${c.n} audios prêts</span>`:""}</div>`;
}
function refreshProgress(sec){
  const st=$("#stats"); if(st) st.innerHTML=statsHtml();
  const d=[...document.querySelectorAll("details.grp")].find(x=>x.dataset.sec===sec);
  if(d) d.querySelector("summary").innerHTML=groupSum(sec);
}

    <div class="ch">

function item(id){ return (S.items[S.tab]||[]).find(i=>i.id===id) }

function wire(m){
  m.querySelectorAll(".card").forEach(c=>{
    const i=item(c.dataset.id), save=c.querySelector('[data-act="save"]');
    const dirty=()=>{ const d=[...c.querySelectorAll("[data-f]")].some(el=>fval(el)!==(i[el.dataset.f]||""));
      save.hidden=!d; c.classList.toggle("dirty",d);
      const w=c.querySelector("[data-w]"); const mg=c.querySelector('[data-f="mg"]').value, fr=c.querySelector('[data-f="fr"]').value;
      w.textContent = (S.tab==="survey"||S.tab==="choice") && vars(fr)!==vars(mg) && mg.trim() ? "Attention: les ${…} ne sont pas les mêmes qu'en français ("+(vars(fr)||"aucun")+")." : "" };
    c.querySelectorAll("[data-f]").forEach(el=>{ el.oninput=dirty;
      el.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); if(!save.disabled) doSave(c,{}) } } });
    save.onclick=()=>doSave(c,{});
    c.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>doSave(c,{status:b.dataset.st}));
    c.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>doSave(c,{text_ready:b.dataset.tr==="1"}));
    const ef=c.querySelector('[data-act="editfr"]');
    if(ef) ef.onclick=()=>{ c.querySelector("[data-frshow]").hidden=true; const t=c.querySelector('[data-f="fr"]'); t.hidden=false; t.focus(); ef.remove() };
    const me=c.querySelector('[data-act="me"]');
    if(me) me.onclick=()=>{ c.querySelector('[data-f="assignee"]').value=S.who; doSave(c,{}) };
    const sb=c.querySelector('[data-act="studio"]');
    if(sb) sb.onclick=()=>openStudio(i.id);
    const pb=c.querySelector('[data-act="play"]');
    if(pb) pb.onclick=()=>playTake(i.id.replace(/^audio:/,""),pb);
  });
}
function splitMg(mg){ const s=String(mg||""), k=s.indexOf(" — "); return k<0?[s,""]:[s.slice(0,k),s.slice(k+3)] }
function fval(el){ return el.dataset.f==="mg" && el.dataset.opts!==undefined
  ? el.value + (el.dataset.opts ? " — "+el.dataset.opts : "") : el.value }

async function doSave(c,extra){
  const i=item(c.dataset.id), body={action:"save",id:i.id,base:i.at};
  c.querySelectorAll("[data-f]").forEach(el=>{ if(fval(el)!==(i[el.dataset.f]||"")) body[el.dataset.f]=fval(el) });
  Object.assign(body,extra);

  c.style.opacity=.6;
  try{
    const r=await api(body);
    if(!r.ok && r.error==="conflit"){
      c.style.opacity=1;
      const o=r.item;
      if(confirm(`${o.by} a modifié cette ligne à ${when(o.at)}.\n\nSa version (malgache):\n${o.mg.slice(0,400)}\n\nOK = garder MA version (écrase la sienne)\nAnnuler = prendre SA version`)){
        i.at=o.at; return doSave(c,extra) }
      Object.assign(i,o); c.outerHTML=card(i); wire($("#main")); return;
    }
    if(!r.ok) throw new Error(r.error);
    for(const k of ["fr","mg","note","assignee"]) if(k in body) i[k]=body[k];
    if("text_ready" in r) i.text_ready=r.text_ready;
    i.status=r.status; i.at=r.at; i.by=S.who; i.pending=r.pending;
    if(i.assignee) S.people.add(i.assignee);
    const tmp=document.createElement("div"); tmp.innerHTML=card(i); const n=tmp.firstElementChild;
    c.replaceWith(n); wire({querySelectorAll:s=>s===".card"?[n]:[]});
    refreshProgress(i.section);
    toast(Object.keys(extra).length? "Prêt ✓" : "Sauvegardé ✓");
  }catch(e){ c.style.opacity=1; toast("Pas enregistré: "+e.message) }
}

// ================================================================ ENREGISTREMENT (téléphone d'abord)
// Prises gardées dans le navigateur (IndexedDB) jusqu'à ce que le serveur dise « reçu ».
const REC={stream:null,mr:null,chunks:[],t0:0,var:null,tick:null,wake:null,ctx:null,an:null,src:null,raf:0,
  aborted:false,abortMsg:"",local:{},state:"idle",mime:"",audio:null};
S.takes={};
async function loadTakes(){ try{ const r=await aapi({action:"meta"}); if(r.ok) S.takes=r.takes||{};
  for(const v in REC.local) if(REC.local[v].remote && REC.local[v].id!==S.takes[v]?.id) delete REC.local[v] }catch(e){} }
function takeOf(v){ return S.takes[v] }
function takeInfo(v){ const t=S.takes[v], q=Q.forVar(v);
  let s = t ? "✓ Enregistré" : "";
  if(q) s += ` · <b class="warnc">⏳ ${q} pas encore envoyée${q>1?"s":""}</b>`;
  return s }
const fmt=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0") };
function blobB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>rej(r.error); r.readAsDataURL(b) }) }
function xhrPost(fn,payload,onprog){ return new Promise((res,rej)=>{ const x=new XMLHttpRequest();
  x.open("POST",SUPA_URL+"/rest/v1/rpc/"+fn); x.setRequestHeader("apikey",SUPA_KEY);
  x.setRequestHeader("Authorization","Bearer "+SUPA_KEY); x.setRequestHeader("Content-Type","application/json");
  x.timeout=180000; x.upload.onprogress=e=>{ if(e.lengthComputable&&onprog) onprog(e.loaded/e.total) };
  x.onload=()=>{ if(x.status>=200&&x.status<300){ try{ res(JSON.parse(x.responseText)) }catch(e){ rej(e) } } else rej(new Error("serveur "+x.status)) };
  x.onerror=()=>rej(new Error("pas de réseau")); x.ontimeout=()=>rej(new Error("réseau trop lent"));
  x.send(JSON.stringify({body:payload})) }) }

const Q={items:[],db:null,busy:false,state:{},t:0,
  async open(){ if(this.db!==null) return this.db;
    try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open("miara_rec",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("q",{keyPath:"cid"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error) }) }
    catch(e){ this.db=false } return this.db },
  async load(){ const db=await this.open(); if(!db) return;
    const all=await new Promise(res=>{ try{ const t=db.transaction("q").objectStore("q").getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]) }catch(e){ res([]) } });
    for(const it of all) if(!this.items.some(x=>x.cid===it.cid)){ it.saved=true; this.items.push(it) }
    this.badge(); if(this.items.length) this.run() },
  async put(it){ this.items.push(it); const db=await this.open();
    if(db) try{ await new Promise((res,rej)=>{ const t=db.transaction("q","readwrite"); t.objectStore("q").put(it); t.oncomplete=res; t.onerror=()=>rej(t.error) }); it.saved=true }catch(e){ it.saved=false }
    this.badge(); this.run() },
  async del(cid){ this.items=this.items.filter(x=>x.cid!==cid); const db=await this.open();
    if(db) try{ db.transaction("q","readwrite").objectStore("q").delete(cid) }catch(e){} this.badge() },
  forVar(v){ return this.items.filter(x=>x.var===v).length },
  badge(){ const b=$("#qbadge"); if(!b) return; const n=this.items.length;
    b.innerHTML = n?`<span class="chip s-a_corriger" title="Prises pas encore envoyées">⏳ ${n} à envoyer</span> `:"" },
  async run(){ if(this.busy || !S.key) return; this.busy=true; clearTimeout(this.t);
    try{ for(const it of [...this.items]){
        const st=this.state[it.cid]={pct:0,err:""}; studioUp(it.var);
        try{
          const data=await blobB64(it.blob);
          const r=await xhrPost("miara_audio_api",{action:"upload",key:S.key,who:it.who||S.who,var:it.var,cid:it.cid,
                                 mime:it.mime,ext:it.ext,dur_ms:Math.round(it.dur),data},p=>{ st.pct=p; studioUp(it.var) });
          if(!r.ok){
            if(r.error==="mot_de_passe"){ st.err="mot de passe changé — reconnectez-vous"; studioUp(it.var); break }
            if(["introuvable","vide","trop_long"].includes(r.error)){ toast("Prise refusée ("+r.error+")"); delete this.state[it.cid]; await this.del(it.cid); studioUp(it.var); continue }
            throw new Error(r.error) }
          const i=(S.items.audio||[]).find(x=>x.id==="audio:"+it.var);
          if(i){ i.status=r.status; i.at=r.at; i.assignee=it.who||S.who; i.by=it.who||S.who }
          const t=S.takes[it.var]||{n:0};
          S.takes[it.var]={n:(t.n||0)+(r.dup?0:1),id:r.take,who:it.who||S.who,at:new Date().toISOString(),ext:it.ext};
          if(REC.local[it.var]) REC.local[it.var].id=r.take;
          delete this.state[it.cid]; await this.del(it.cid); refreshCard(it.var); studioUp(it.var,true);
        }catch(e){ st.err=e.message||"pas de réseau"; studioUp(it.var); this.t=setTimeout(()=>this.run(),15000); break }
      } }finally{ this.busy=false } } };
window.addEventListener("online",()=>Q.run());
window.addEventListener("beforeunload",e=>{ if(REC.state==="rec" || Q.items.some(x=>!x.saved)){ e.preventDefault(); e.returnValue="" } });

function pickMime(){ if(!window.MediaRecorder) return null;
  for(const m of ["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus","audio/ogg"])
    try{ if(MediaRecorder.isTypeSupported(m)) return m }catch(e){}
  return "" }
function extOf(m){ m=String(m||""); return m.includes("webm")?"webm":(m.includes("mp4")||m.includes("aac")||m.includes("m4a"))?"m4a":m.includes("ogg")?"ogg":"webm" }
async function mic(){
  if(REC.stream && REC.stream.getAudioTracks().some(t=>t.readyState==="live")) return REC.stream;
  if(!navigator.mediaDevices?.getUserMedia) throw new Error("Ce navigateur ne peut pas enregistrer. Utilisez Chrome (Android) ou Safari (iPhone).");
  try{ REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}) }
  catch(e){ throw new Error(["NotAllowedError","SecurityError","PermissionDeniedError"].includes(e.name)
    ? "Micro refusé. Autorise le micro dans les réglages du navigateur, puis recharge la page."
    : "Micro introuvable ("+e.name+"). Branchez ou libérez le micro, puis réessayez.") }
  REC.stream.getAudioTracks().forEach(t=>t.onended=()=>abortRec("Le micro a été coupé (appel ?)."));
  return REC.stream }
async function startRec(v){
  if(REC.state!=="idle") return;
  const AC=window.AudioContext||window.webkitAudioContext;           // créé pendant le toucher (iPhone)
  if(!REC.ctx && AC) try{ REC.ctx=new AC() }catch(e){}
  try{ REC.ctx?.resume?.() }catch(e){}
  const mime=pickMime();
  if(mime===null){ studioMsg("Ce navigateur ne peut pas enregistrer. Utilisez Chrome (Android) ou Safari (iPhone, iOS 14.3+).","bad"); return }
  REC.state="starting"; studioMsg("","");
  let st; try{ st=await mic() }catch(e){ REC.state="idle"; studioMsg(e.message,"bad"); return }
  REC.mime=mime; REC.chunks=[]; REC.aborted=false; REC.abortMsg=""; REC.var=v;
  try{ REC.mr = mime ? new MediaRecorder(st,{mimeType:mime,audioBitsPerSecond:64000}) : new MediaRecorder(st) }
  catch(e){ try{ REC.mr=new MediaRecorder(st) }catch(e2){ REC.state="idle"; studioMsg("Enregistrement impossible: "+e2.message,"bad"); return } }
  REC.mr.ondataavailable=e=>{ if(e.data&&e.data.size) REC.chunks.push(e.data) };
  REC.mr.onstop=finishRec;
  REC.mr.start(1000); REC.t0=Date.now(); REC.state="rec";
  try{ REC.wake = navigator.wakeLock ? await navigator.wakeLock.request("screen") : null }catch(e){ REC.wake=null }
  meterStart(st); REC.tick=setInterval(studioTimer,250); studioRender();
}
function stopRec(){ if(REC.state!=="rec") return; REC.state="stopping"; try{ REC.mr.stop() }catch(e){ finishRec() } }
function abortRec(msg){ if(REC.state!=="rec") return; REC.aborted=true; REC.abortMsg=msg; REC.state="stopping";
  try{ REC.mr.stop() }catch(e){ finishRec() } }
function finishRec(){
  if(REC.state==="idle") return;
  clearInterval(REC.tick); meterStop(); try{ REC.wake?.release() }catch(e){} REC.wake=null;
  const dur=Date.now()-REC.t0, v=REC.var; REC.state="idle";
  if(REC.aborted){ REC.chunks=[]; studioMsg((REC.abortMsg?REC.abortMsg+" ":"")+"Enregistrement interrompu — recommence.","bad"); studioRender(); return }
  const type=(REC.mr&&REC.mr.mimeType)||REC.mime||"audio/webm";
  const blob=new Blob(REC.chunks,{type}); REC.chunks=[];
  if(dur<700||blob.size<1000){ studioMsg("Trop court. Recommence.","bad"); studioRender(); return }
  if(REC.local[v]) try{ URL.revokeObjectURL(REC.local[v].url) }catch(e){}
  REC.local[v]={url:URL.createObjectURL(blob),dur};
  const cid=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));
  Q.put({cid,var:v,blob,mime:type,ext:extOf(type),dur,who:S.who,at:Date.now()});
  studioMsg("",""); studioRender();
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) abortRec("La page est passée en arrière-plan.") });
window.addEventListener("pagehide",()=>abortRec("La page a été fermée."));
function meterStart(st){ try{ if(!REC.ctx) return; REC.src=REC.ctx.createMediaStreamSource(st); REC.an=REC.ctx.createAnalyser();
  REC.an.fftSize=512; REC.src.connect(REC.an); const buf=new Uint8Array(REC.an.fftSize);
  const loop=()=>{ REC.an.getByteTimeDomainData(buf); let s=0; for(const x of buf){ const d=(x-128)/128; s+=d*d }
    const el=$("#meter i"); if(el) el.style.width=Math.min(100,Math.sqrt(s/buf.length)*400)+"%"; REC.raf=requestAnimationFrame(loop) };
  loop() }catch(e){} }
function meterStop(){ cancelAnimationFrame(REC.raf); try{ REC.src?.disconnect() }catch(e){} REC.src=null; const el=$("#meter i"); if(el) el.style.width="0" }

async function playTake(v,btn){
  const a=REC.audio||(REC.audio=new Audio());
  if(!a.paused && a.dataset.v===v){ a.pause(); if(btn) btn.textContent="▶ Écouter"; return }
  let url=REC.local[v]?.url;
  if(!url){ const t=S.takes[v]; if(!t) return; if(btn) btn.textContent="…";
    try{ const r=await aapi({action:"get",id:t.id}); if(!r.ok) throw new Error(r.error);
      const bin=Uint8Array.from(atob(r.data),c=>c.charCodeAt(0));
      url=URL.createObjectURL(new Blob([bin],{type:r.mime||"audio/webm"})); REC.local[v]={url,remote:true,id:t.id};
    }catch(e){ if(btn) btn.textContent="▶ Écouter"; toast("Lecture impossible: "+e.message); return } }
  a.src=url; a.dataset.v=v; a.onended=()=>{ if(btn) btn.textContent="▶ Écouter" };
  try{ await a.play(); if(btn) btn.textContent="⏸ Pause" }
  catch(e){ if(btn) btn.textContent="▶ Écouter"; toast("Ce téléphone ne lit pas ce format ("+(S.takes[v]?.ext||"?")+"). Écoutez sur un ordinateur.") }
}
function refreshCard(v){
  if(S.tab!=="audio") return;
  const i=(S.items.audio||[]).find(x=>x.id==="audio:"+v), c=document.querySelector(`.card[data-id="audio:${CSS.escape(v)}"]`);
  if(c&&i){ const t=document.createElement("div"); t.innerHTML=card(i); const n=t.firstElementChild; c.replaceWith(n); wire({querySelectorAll:s=>s===".card"?[n]:[]}) }
  if(i) refreshProgress(i.section) }

// ---- le studio: un clip par écran
const ST={idx:0,mode:"todo",edit:false,msg:"",msgc:""};
const doneSt=i=>["enregistre","verifie"].includes(i.status);
const isTodo=i=>!doneSt(i) && !Q.forVar(i.id.slice(6));
function openStudio(id){
  const all=S.items.audio||[]; let k=id?all.findIndex(i=>i.id===id):all.findIndex(isTodo); if(k<0) k=0;
  ST.idx=k; ST.edit=false; ST.msg="";
  let el=$("#studio"); if(!el){ el=document.createElement("div"); el.id="studio"; el.className="studio"; document.body.appendChild(el) }
  document.body.classList.add("noscroll"); studioRender() }
function closeStudio(){
  if(REC.state==="rec"){ if(!confirm("Arrêter et jeter l'enregistrement en cours ?")) return; abortRec("") }
  $("#studio")?.remove(); document.body.classList.remove("noscroll"); if(S.tab==="audio") listView($("#main")) }
function go(d){
  if(REC.state!=="idle") return; const all=S.items.audio||[]; let k=ST.idx;
  if(ST.mode==="todo"){ let found=false; for(let n=0;n<all.length;n++){ k=(k+d+all.length)%all.length; if(isTodo(all[k])){ found=true; break } }
    if(!found){ toast("Tout est enregistré 🎉"); k=Math.min(all.length-1,Math.max(0,ST.idx+d)) } }
  else k=Math.min(all.length-1,Math.max(0,k+d));
  ST.idx=k; ST.edit=false; ST.msg=""; studioRender(); const t=$("#studio .stext"); if(t) t.scrollTop=0 }
function studioMsg(t,c){ ST.msg=t; ST.msgc=c; const el=$("#studio .st-msg"); if(el){ el.textContent=t; el.className="st-msg "+c } }
function readHtml(q){ return esc(q).replace(/\[([^\]]*)\]/g,'<span class="instr">[$1]</span>') }
function upLine(v){
  const pend=Q.items.filter(x=>x.var===v);
  if(pend.length){ const st=Q.state[pend[0].cid];
    if(st?.err) return `<span class="err">⚠ Pas encore envoyé: ${esc(st.err)}. Nouvel essai automatique. ${pend.every(x=>x.saved)?"La prise est gardée sur ce téléphone.":"Ne fermez pas la page."}</span>`;
    return `⏳ Envoi… ${st?Math.round(100*st.pct):0}%` }
  return S.takes[v]?"✓ Enregistré":"" }
function studioUp(v,full){ const all=S.items.audio||[], i=all[ST.idx]; if(!$("#studio")||!i||i.id!=="audio:"+v) return;
  if(full && REC.state==="idle") return studioRender();
  const el=$("#studio .st-status"); if(el) el.innerHTML=upLine(v) }
function studioTimer(){ const el=$("#sttime"); const ms=Date.now()-REC.t0; if(el) el.textContent=fmt(ms);
  if(ms>6*60*1000){ stopRec(); toast("Arrêt automatique après 6 minutes.") } }

function studioRender(){
  const el=$("#studio"); if(!el) return;
  const all=S.items.audio||[], i=all[ST.idx]; if(!i){ el.innerHTML=`<div class="empty">Rien à enregistrer.</div>`; return }
  const v=i.id.slice(6), [q,o]=splitMg(i.mg), [fq,fo]=splitMg(i.fr), rec=REC.state==="rec", busy=REC.state!=="idle";
  const done=all.filter(doneSt).length, hasTake=!!(S.takes[v]||REC.local[v]), isOk=i.status==="verifie";
  el.innerHTML=`
  <div class="st-top"><button class="btn small" id="stclose">✕</button>
    <span><b>${done}</b>/${all.length} enregistrés</span>
    <span class="chip s-${i.status}">${SHORT[i.status]||i.status}</span></div>
  <div class="stext">
    <div class="st-name"><span class="saveas">${esc(v)}</span>${i.flag?` <span class="chip s-a_revoir">⚠ texte à vérifier</span>`:""}</div>
    ${ST.edit?`<textarea id="stedit" class="mg read" rows="8">${esc(q)}</textarea>
      <div class="foot"><button class="btn primary" id="stsave">Sauvegarder</button><button class="btn" id="stcancel">Annuler</button></div>`
      :`<div class="readbig">${readHtml(q)}</div>`}
    ${o?`<div class="readbig2">— ${esc(o)}</div>`:""}
    <div class="frbox">${esc(fq)}${fo?`<br>— ${esc(fo)}`:""}</div>
    ${!ST.edit&&!busy?`<button class="link" id="stedbtn">✏️ corriger le malgache</button>`:""}
  </div>
  <div class="st-ctl">
    <div class="st-msg ${ST.msgc}">${esc(ST.msg)}</div>
    <div class="st-meter"><span class="dot ${rec?"on":""}"></span><span id="sttime">${rec?fmt(Date.now()-REC.t0):(REC.local[v]?.dur?fmt(REC.local[v].dur):"0:00")}</span><span id="meter"><i></i></span><span class="st-status">${upLine(v)}</span></div>
    <div class="st-btns">
      <button class="round side" id="stprev" ${busy?"disabled":""} aria-label="Clip précédent">←</button>
      ${rec?`<button class="round stop" id="ststop" aria-label="Arrêter">■</button>`
           :`<button class="round rec" id="strec" ${busy||ST.edit?"disabled":""} aria-label="Enregistrer">●</button>`}
      <button class="round side" id="stnext" ${busy?"disabled":""} aria-label="Clip suivant">→</button>
    </div>
    <div class="st-row2">
      <button class="btn" id="stplay" ${hasTake&&!busy?"":"disabled"}>▶ Écouter</button>
      <button class="btn ${i.text_ready?"on-ok":""}" id="sttext" ${busy?"disabled":""}>✓ Texte prêt</button>
      <button class="btn ${isOk?"on-ok":""}" id="stok" ${busy||!S.takes[v]?"disabled":""}>✓ Audio prêt</button>
    </div>
    <button class="btn primary wide" id="stgo" ${busy?"disabled":""}>Suivant →</button>
  </div>`;
  const on=(s,f)=>{ const b=el.querySelector(s); if(b) b.onclick=f };
  on("#stclose",closeStudio); on("#stprev",()=>go(-1)); on("#stnext",()=>go(1)); on("#stgo",()=>go(1));
  on("#strec",()=>startRec(v)); on("#ststop",stopRec);
  on("#stplay",e=>playTake(v,e.currentTarget));
  on("#stok",()=>studioSave(i,{status:isOk?"enregistre":"verifie"},false));
  on("#sttext",()=>studioSave(i,{text_ready:!i.text_ready},false));
  on("#stedbtn",()=>{ ST.edit=true; studioRender(); $("#stedit")?.focus() });
  on("#stcancel",()=>{ ST.edit=false; studioRender() });
  on("#stsave",async()=>{ const t=$("#stedit").value.trim(); const mg=t+(o?" — "+o:"");
    if(mg===i.mg){ ST.edit=false; return studioRender() }
    if(await studioSave(i,{mg},true)) toast("Sauvegardé ✓ — réenregistrez le clip") });
}
async function studioSave(i,fields,checkBase){
  try{ const r=await api({action:"save",id:i.id,base:checkBase?i.at:"",...fields});
    if(!r.ok){ if(r.error==="conflit"){ Object.assign(i,r.item); ST.edit=false; studioRender(); toast((r.item.by||"Quelqu'un")+" a changé ce texte. Voici sa version."); return false }
      toast("Pas enregistré: "+r.error); return false }
    Object.assign(i,fields); i.status=r.status; i.text_ready=r.text_ready; i.at=r.at; i.by=S.who; ST.edit=false; studioRender(); refreshCard(i.id.slice(6)); return true
  }catch(e){ toast("Pas enregistré (réseau): "+e.message); return false } }

// ================================================================ APERÇU: l'enquête comme la fille la voit
const PV={layout:null,media:null,idx:0,lang:"mg",built:""};
function pvFmt(s){
  // keep the form's simple formatting (b, i, br, div box, span big), escape everything else
  const T={D:"<div class='pbox'>",d:"</div>",S:"<span class='pbig'>",s:"</span>",B:"<b>",b:"</b>",I:"<i>",i:"</i>",R:"<br>"};
  let t=String(s||"").replace(/<div[^>]*>/gi,"\u0001D").replace(/<\/div>/gi,"\u0001d")
    .replace(/<span[^>]*>/gi,"\u0001S").replace(/<\/span>/gi,"\u0001s")
    .replace(/<b>/gi,"\u0001B").replace(/<\/b>/gi,"\u0001b").replace(/<i>/gi,"\u0001I").replace(/<\/i>/gi,"\u0001i")
    .replace(/<br\s*\/?>/gi,"\u0001R").replace(/\n/g,"\u0001R");
  t=esc(t).replace(/\u0001([DdSsBbIiR])/g,(m,k)=>T[k]);
  // close what the text opened (a broken tag must not break the page)
  for(const [o,c] of [["<div class='pbox'>","</div>"],["<span class='pbig'>","</span>"],["<b>","</b>"],["<i>","</i>"]]){
    const n=t.split(o).length-t.split(c).length; if(n>0) t+=c.repeat(n); else if(n<0) t=t.split(c).join("") }
  return t.replace(/\$\{([a-z0-9_]+)\}/gi,"<span class='pvar'>[$1]</span>") }
async function previewView(m){
  m.innerHTML=`<div class="loading">Chargement de l'enquête…</div>`;
  try{
    const jobs=[];
    if(!PV.layout) jobs.push(api({action:"layout"},"miara_preview_api").then(r=>{ if(!r.ok) throw new Error(r.error); PV.layout=r.data; PV.built=r.built_at }));
    if(!PV.media) jobs.push(api({action:"media"},"miara_preview_api").then(r=>{ PV.media={};
      for(const [k,v] of Object.entries(r.media||{})) PV.media[k]=`data:${v.mime};base64,${v.data}` }));
    for(const k of ["survey","choice","audio"]) jobs.push(api({action:"list",kind:k}).then(r=>{ if(r.ok) S.items[k]=r.items }));
    jobs.push(loadTakes());
    await Promise.all(jobs);
  }catch(e){ m.innerHTML=`<div class="empty">Erreur: ${esc(e.message)}</div>`; return }
  if(!PV.layout?.screens?.length){ m.innerHTML=`<div class="empty">Pas encore d'aperçu. Oscar lance <code>python3 console/build_preview.py</code>.</div>`; return }
  PV.idx=Math.min(PV.layout.screens.length-1,Math.max(0,parseInt(load("miara_pv_idx"))||0));
  PV.lang=load("miara_pv_lang")||"mg";
  pvRender(m);
}
function pvText(id,fr,mg){
  const it=id && ((S.items.survey||[]).find(x=>x.id===id) || (S.items.choice||[]).find(x=>x.id===id));
  if(it){ fr=it.fr; mg=it.mg }
  return PV.lang==="mg" ? (mg||fr) : fr }
function pvAudio(v){
  if(!v) return "";
  const a=(S.items.audio||[]).find(x=>x.id==="audio:"+v);
  if(S.takes[v]) return `<button class="btn small pvplay" data-v="${esc(v)}">▶ Écouter</button>${a&&a.status==="verifie"?` <span class="chip s-verifie">Audio prêt</span>`:""}`;
  return `<span class="chip pvno">🔇 pas encore enregistré</span>` }
function pvWidget(w){
  if(!w) return "";
  if(w.k==="game") return `<div class="pgame">🎮 Le jeu « ${esc(w.name)} » s'affiche ici</div>`;
  if(w.k==="num") return `<div class="pinp">123 <span>clavier chiffres</span></div>`;
  if(w.k==="text") return `<div class="pinp tall">Abc… <span>clavier</span></div>`;
  if(w.k==="sign") return `<div class="pinp tall">✍ signature</div>`;
  if(w.k==="select") return w.opts.map(o=>`<div class="popt"><span class="${w.multi?"pchk":"prad"}"></span>
      ${o.img&&PV.media[o.img]?`<img src="${PV.media[o.img]}" alt="">`:""}<span>${pvFmt(pvText(o.id,o.fr,o.mg))}</span></div>`).join("");
  return "" }
function pvRow(r){
  const meta=[...r.meta]; if(r.revoir) meta.push("🟨 malgache à vérifier");
  const hint=pvText(r.hid,r.hfr,r.hmg);
  return `<div class="pq">
    <div class="pqt">${pvFmt(pvText(r.id,r.fr,r.mg))}</div>
    ${hint?`<div class="phint">${pvFmt(hint)}</div>`:""}
    ${r.img&&PV.media[r.img]?`<img class="plab" src="${PV.media[r.img]}" alt="">`:""}
    <div class="paud">${pvAudio(r.audio)}</div>
    ${pvWidget(r.w)}
    ${meta.length?`<div class="pmeta">${meta.map(esc).join(" · ")}</div>`:""}
  </div>` }
function pvRender(m){
  const sc=PV.layout.screens, n=sc.length, s=sc[PV.idx];
  const secs=[]; sc.forEach((x,k)=>{ if(!secs.length||secs[secs.length-1].fr!==x.sec_fr) secs.push({fr:x.sec_fr,mg:x.sec_mg,k}) });
  const cur=[...secs].reverse().find(x=>x.k<=PV.idx);
  m.innerHTML=`<div class="pvtop">
      <div class="seg"><button data-l="mg" class="${PV.lang==="mg"?"on":""}">Malagasy</button><button data-l="fr" class="${PV.lang==="fr"?"on":""}">Français</button></div>
      <select id="pvjump" aria-label="Aller à la partie">${secs.map(x=>`<option value="${x.k}" ${x===cur?"selected":""}>${esc(x.fr||"Début")}</option>`).join("")}</select>
    </div>
    <div class="phone" id="pvphone">
      <div class="pbar"><span>${PV.idx+1} / ${n}</span><span class="nm">${esc(s.name)}</span></div>
      ${s.sec_fr?`<div class="psec">${esc(PV.lang==="mg"?(s.sec_mg||s.sec_fr):s.sec_fr)}</div>`:""}
      <div class="pscr">${s.note?`<div class="pqt">${esc(s.note)}</div>`:(s.rows||[]).map(pvRow).join("")}</div>
    </div>
    <div class="pnav"><button class="round side" id="pvprev" ${PV.idx?"":"disabled"} aria-label="Écran précédent">←</button>
      <span class="sec">Glissez ou touchez les flèches</span>
      <button class="round side" id="pvnext" ${PV.idx<n-1?"":"disabled"} aria-label="Écran suivant">→</button></div>
    <div class="sec" style="text-align:center;margin-top:6px">Structure lue dans l'Excel le ${when(PV.built)} · textes en direct de la console</div>`;
  const go=d=>{ PV.idx=Math.min(n-1,Math.max(0,PV.idx+d)); store("miara_pv_idx",String(PV.idx)); pvRender(m); window.scrollTo(0,0) };
  $("#pvprev").onclick=()=>go(-1); $("#pvnext").onclick=()=>go(1);
  $("#pvjump").onchange=e=>{ PV.idx=+e.target.value; store("miara_pv_idx",String(PV.idx)); pvRender(m) };
  m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ PV.lang=b.dataset.l; store("miara_pv_lang",PV.lang); pvRender(m) });
  m.querySelectorAll(".pvplay").forEach(b=>b.onclick=()=>playTake(b.dataset.v,b));
  const ph=$("#pvphone"); let x0=null;
  ph.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX },{passive:true});
  ph.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>70) go(dx<0?1:-1) });
}

// ---------------------------------------------------------------- démarrage
S.who=load("miara_who"); S.key=load("miara_key"); S.tab=load("miara_tab")||"audio";
if(!TABS.some(t=>t[0]===S.tab)) S.tab="audio";
if(S.who && S.key){ api({action:"ping"}).then(r=>{ if(r.ok){ shell(); Q.load() } else loginView() })
  .catch(()=>{ loginView("Pas de connexion internet ? Les prises non envoyées restent sur ce téléphone.") }) }
else loginView();
</script>
